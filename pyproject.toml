[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "amadeus_schema"
description = "LinkML data model prototype for AmadeusDB (next-generation amadeus)"
authors = [
  {name = "Nico Matentzoglu", email = "nicolas.matentzoglu@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "pytest>=8",
    # backend round-trip: generated DDL loaded into both engines (scripts/load_and_query.py)
    "duckdb>=1.1",
    "sedonadb>=0.4",
    "pyarrow>=17",
    "pyyaml>=6",
    "geoarrow-pyarrow>=0.2.0",
    "geoarrow-types>=0.3.0",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/amadeus_schema/_version.py",
    # Generated by `just gen-python` / `gen-pydantic`. Formatting them means
    # every regeneration re-dirties the tree and fights ruff format; codespell
    # already skips them for the same reason.
    "src/amadeus_schema/datamodel/amadeus_schema.py",
    "src/amadeus_schema/datamodel/amadeus_schema_pydantic.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/amadeus_schema/datamodel/amadeus_schema_pydantic.py",
  "src/amadeus_schema/datamodel/amadeus_schema.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
# "metdata" is not a typo: it is the real path segment in the GridMET download
# URL, https://www.northwestknowledge.net/metdata/data/. Correcting it would
# break a working URL in the example data.
ignore-words-list = "linke,metdata"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/amadeus_schema/datamodel/amadeus_schema_pydantic.py",
  "src/amadeus_schema/datamodel/amadeus_schema.py",
]
