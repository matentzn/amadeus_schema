  size_bytes: 194560
  sha256: 4e07408562bedb8b60ce05c1decfe3ad16b72230967de01f640b7e4729b49fce
  download_timestamp_utc: "2026-09-18T11:24:03Z"
  valid_time_start: "2026-07-14T05:00:00Z"
  valid_time_end: "2026-07-15T05:00:00Z"
  bbox_wkt: "POLYGON ((-79.1 35.8, -78.6 35.8, -78.6 36.1, -79.1 36.1, -79.1 35.8))"
  srid: 4326
  variables_present:
  - amadeus:pvar/daymet.tmax
  materialization_mode: server_side_subset
  value_state: materialized
  produced_by_run: amadeus:run/proc-daymet-20260918

grid_cell_values:
