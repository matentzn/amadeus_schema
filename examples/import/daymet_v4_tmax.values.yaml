# ─────────────────────────────────────────────────────────────────────────────
# INGEST BUNDLE — Daymet V4 tmax values for the Durham slice
#
# Separate from the import manifest on purpose. The manifest describes the
# PRODUCT and is written once by a contributor; this bundle describes one RUN's
# output and is generated every time data is ingested. Conflating them is how
# catalogs end up with per-run rows in them.
#
# Two cells, one day, chosen so the Daymet-versus-GridMET comparison in
# scripts/import_external.py has something to compare. Values are illustrative,
# but the metadata around them is not: note `valid_time_start` at 05:00Z, which
# is local midnight in Durham (EDT, UTC-4... and EST, UTC-5, in winter — the
# reason `local_midnight` cannot be resolved to a fixed offset at the product
# level and must be applied per date).
# ─────────────────────────────────────────────────────────────────────────────
schema_version: "0.1.0"

tool_runs:
- id: amadeus:run/dl-daymet-20260918
  run_role: download
  tool_name: amadeus
  tool_version: 2.0.0-dev
  function_name: download_daymet
  run_arguments: '{"variables":["tmax"],"years":[2026],"region":"na","bbox":[-79.1,35.8,-78.6,36.1],"subset":"server_side"}'
  run_timestamp_utc: "2026-09-18T11:24:03Z"
  run_duration_seconds: 6.2
  run_environment: '{"R":"4.6.0","engine":"none"}'
  status: succeeded
  # THREDDS NCSS returned exactly the requested box: 190 kB instead of the
  # ~1.4 GB continental annual file. This is the "subset early" principle
  # producing a measurable number.
  materialization_mode: server_side_subset
  bytes_transferred: 194560
  request_count: 1

- id: amadeus:run/proc-daymet-20260918
  run_role: process
  tool_name: amadeus
  tool_version: 2.0.0-dev
  function_name: process_daymet
  run_arguments: '{"variables":"tmax","date":["2026-07-14","2026-07-14"]}'
  run_timestamp_utc: "2026-09-18T11:24:19Z"
  output_row_count: 2
  upstream_runs:
  - amadeus:run/dl-daymet-20260918
  status: succeeded
  run_environment: '{"R":"4.6.0","terra":"1.8-30","engine":"duckdb 1.5.5"}'

