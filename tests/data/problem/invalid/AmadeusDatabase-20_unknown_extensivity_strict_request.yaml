# NOT a rule violation — a MODELLING gap this schema makes visible.
# `extensivity: unknown` is permitted so migration need not assess every legacy
# variable at once, but `strict_extensivity_check: strict` on a request is meant
# to refuse it. That check is a query-planner responsibility, not a LinkML
# rule: LinkML cannot see across the request-to-variable join. This file
# VALIDATES, and the fact that it does is the finding — see REPORT.md section
# on what LinkML rules cannot express.
