# TYPES AND PATTERNS: enum membership, CRS form, H3 index form, SHA-256 form,
# container digest form. All caught by the type layer rather than by rules.
schema_version: "0.1.0"
data_sources:
- id: "x:src/a"
  name: a
  access_protocol: carrier_pigeon      # not a permissible value
products:
- id: "x:prod/p"
  name: p
  data_source: "x:src/a"
  spatial_support_type: raster_grid_cell
  temporal_resolution: fortnightly     # not a permissible value
  grid_definition: "x:grid/g"
  crs: "4326"                          # missing authority prefix
grid_definitions:
- {id: "x:grid/g", name: g, crs: "EPSG:4326", resolution_x: 0.04, resolution_y: 0.04}
tool_runs:
- id: "x:run/1"
  run_role: download
  tool_name: amadeus
  tool_version: "1.0"
  run_timestamp_utc: "2026-07-16T04:00:02Z"
  status: succeeded
  container_image_digest: "latest"     # must be sha256:<64 hex>
  input_file_sha256: "deadbeef"        # must be 64 hex chars
