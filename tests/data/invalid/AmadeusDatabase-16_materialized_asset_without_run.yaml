# RULE: if values were written into a value table, the run that wrote them must
# be identified. This is the link behind objective O-02.
schema_version: "0.1.0"
data_sources:
- {id: "x:src/a", name: a}
products:
- {id: "x:prod/p", name: p, data_source: "x:src/a", spatial_support_type: point, temporal_resolution: annual}
assets:
- id: "x:asset/1"
  product: "x:prod/p"
  url: https://example.org/file.nc
  materialization_mode: server_side_subset
  value_state: materialized      # rows exist...
  # produced_by_run: ABSENT  <-- violates the rule
