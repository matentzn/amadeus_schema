extraction_requests:
- id: amadeus:request/durham-heat-aq-2026-07
  name: durham_heat_aq_2026_07
  location_set: amadeus:locset/durham-readme-example
  requested_canonical_variables:
  - amadeus:var/air_temperature_daily_maximum
  - amadeus:var/pm25_mass_concentration
  - amadeus:var/smoke_plume_density_class
  # Pinned to a specific delivery for temperature, so re-running cannot silently
  # switch from GridMET to PRISM and change the answer.
  requested_product_variables:
  - amadeus:pvar/gridmet.tmmx
  time_window_start: "2026-07-14T00:00:00Z"
  time_window_end: "2026-07-16T00:00:00Z"
  temporal_grouping: day
  buffer_radius_m: 10000.0
  extraction_method: exact_extract
  aggregation_method: area_weighted_mean
  lag_days: [0, 1]
  target_geography_type: buffered_point
  output_orientation: long
  materialization_mode: direct_remote_scan
  # No status mixing: the AirNow preliminary row is excluded by default, and
  # including it would require a stated policy.
  status_mixing_policy: refuse
  strict_extensivity_check: strict
  requested_by: nmatentzoglu
  request_timestamp_utc: "2026-09-18T08:41:10Z"
  request_hash: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  generated_sql: |
    -- The query the meeting plan's figure sketches, against this schema.
    SELECT
      l.location_key,
      cv.name                         AS variable,
      date_trunc('day', g.valid_time_start) AS day,
      SUM(g.value * ST_Area(ST_Intersection(g.cell_polygon, b.buf))
                  / ST_Area(g.cell_polygon))
        / SUM(ST_Area(ST_Intersection(g.cell_polygon, b.buf))
                  / ST_Area(g.cell_polygon))  AS value,
      cv.units_ucum,
      COUNT(*)                        AS contributing_value_count
    FROM (SELECT location_key,
                 ST_Buffer(location_geom, 10000) AS buf
          FROM "Location_geo") b
    JOIN "Location_geo" l USING (location_key)
    JOIN "GridCellValue_geo" g
      ON ST_Intersects(g.cell_polygon, b.buf)
    JOIN "ProductVariable"    pv ON g.product_variable   = pv.id
    JOIN "CanonicalVariable"  cv ON g.canonical_variable = cv.id
    WHERE g.product_variable = 'amadeus:pvar/gridmet.tmmx'
      AND g.valid_time_start >= TIMESTAMP '2026-07-14 00:00:00'
      AND g.valid_time_start <  TIMESTAMP '2026-07-16 00:00:00'
      AND g.data_status <> 'superseded'
      AND g.null_semantics = 'present'
    GROUP BY 1, 2, 3, 5;

