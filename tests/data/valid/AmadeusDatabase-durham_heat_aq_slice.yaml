    Land SURFACE temperature, not air temperature. Pointed at the air
    temperature canonical variable here only to make the point that doing so is
    a modelling error the schema should catch: `cf_standard_name` is
    `surface_temperature` while the canonical variable's `standard_name` is
    `CF:air_temperature`. A cheap consistency check over these two fields would
    flag it, and that check is worth writing.
  metadata_gaps:
  - under_investigation

