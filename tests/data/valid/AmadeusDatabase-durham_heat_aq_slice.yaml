# ═════════════════════════════════════════════════════════════════════════════
# CATALOG — product variables
#
# Read the first two together. Same canonical variable; different native name,
# different native unit, different conversion, different day boundary (on the
# product). That is what "comparable but not interchangeable" means, spelled out.
# ═════════════════════════════════════════════════════════════════════════════
product_variables:
- id: amadeus:pvar/gridmet.tmmx
  product: amadeus:product/gridmet
  canonical_variable: amadeus:var/air_temperature_daily_maximum
  native_name: tmmx
  label: GridMET daily maximum temperature
  native_units_ucum: K
  native_value_offset: -273.15
  unit_conversion_formula: "value_Cel = value_K - 273.15"
  cf_standard_name: air_temperature
  cf_cell_methods: "time: maximum"
  aggregation_method: maximum
  aggregation_window_iso: P1D
  temporal_alignment: interval
  missing_value_sentinel: "32767"
  layer_name_template: "{native_name}_{YYYYMMDD}"
  amadeus_variable_code: tmmx
  harmonization_note: >-
    Kelvin at source. amadeus currently converts at render time without
    recording the conversion — the exact failure mode found in the Axle
    DE-SynPUF atlas, where a Kelvin-to-Celsius step survived only as a column
    name.
  metadata_gaps:
  - available_but_not_extracted

- id: amadeus:pvar/prism.tmax
  product: amadeus:product/prism_daily
  canonical_variable: amadeus:var/air_temperature_daily_maximum
  native_name: tmax
  label: PRISM daily maximum temperature
  native_units_ucum: Cel
  cf_standard_name: air_temperature
  cf_cell_methods: "time: maximum"
  aggregation_method: maximum
  aggregation_window_iso: P1D
  temporal_alignment: interval
  missing_value_sentinel: "-9999"
  layer_name_template: "{native_name}_{YYYYMMDD}"
  amadeus_variable_code: tmax
  harmonization_note: >-
    Already Celsius, and a local-midnight day. Numerically comparable to
    gridmet.tmmx only after accounting for the day-boundary difference; for
    heat metrics that difference has been measured at over 1 °C.

- id: amadeus:pvar/aqs.88101
  product: amadeus:product/aqs_daily
  canonical_variable: amadeus:var/pm25_mass_concentration
  native_name: "88101"
  label: PM2.5 - Local Conditions (FRM/FEM)
  native_units_ucum: ug/m3
  cf_standard_name: mass_concentration_of_pm2p5_ambient_aerosol_particles_in_air
