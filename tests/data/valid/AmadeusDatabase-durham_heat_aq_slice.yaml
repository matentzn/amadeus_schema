# ─────────────────────────────────────────────────────────────────────────────
# AmadeusDB sample instance — "Durham heat + air quality slice"
#
# A deliberately small but complete slice designed to exercise every part of the
# model at once, using real amadeus sources and the location from the package
# README's own worked example (Durham, NC; -78.8277, 35.95013).
#
# What it is built to demonstrate:
#
#  1. **Cross-source variable identity.** `gridmet.tmmx` and `prism.tmax` are two
#     ProductVariables over ONE CanonicalVariable. They disagree on units (K vs
#     °C), resolution (4 km vs 800 m) and day boundary (noon-GMT vs local
#     midnight) — every one of those differences is a slot, and the last one is
#     the Daymet/GridMET 1.26 °C discrepancy in miniature.
#  2. **All four value shapes.** StationObservation (AQS), GridCellValue
#     (GridMET), AreaValue (HMS smoke plume), HexCellValue (hexified GridMET),
#     plus VectorFeature (gROADS).
#  3. **The AQS/AirNow rule.** The same monitor, parameter and hour appears
#     twice: an AirNow `preliminary` row and an AQS `quality_controlled` row.
#     Neither overwrote the other. The AirNow row is marked `superseded` and
#     points at its replacement.
#  4. **Extensivity.** An intensive variable (temperature, mean), an extensive
#     one (population count, sum) and a categorical one (land cover, mode).
#  5. **Provenance to the bytes.** Every value resolves through
#     `processing_run` to a ToolRun and through `asset` to a URL and a hash.
#  6. **The query-first contract.** One ExtractionRequest with its generated
#     SQL, and the AmbientValueAtLocation rows it produced.
#  7. **Registered-but-not-ingested.** The MODIS asset is registered for
#     discovery with `values_materialized: false` — the asset-centric path the
#     modernization plan asks for.
# ─────────────────────────────────────────────────────────────────────────────
schema_version: "0.1.0"

