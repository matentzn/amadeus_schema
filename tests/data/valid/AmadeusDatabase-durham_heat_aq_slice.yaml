# ═════════════════════════════════════════════════════════════════════════════
# CATALOG — canonical variables
#
# The cross-source anchor. Note what lives HERE rather than on the product:
# the standard name, the canonical unit, the measurement kind, the extensivity
# and the plausible range. These must agree across sources or the variable is
# not the same variable.
# ═════════════════════════════════════════════════════════════════════════════
canonical_variables:
- id: amadeus:var/air_temperature_daily_maximum
  name: air_temperature_daily_maximum
  label: Daily maximum near-surface air temperature
  description: >-
    Maximum of near-surface (nominally 2 m) air temperature over a day. The day
    is defined by the delivering product, not by this variable — see
    `day_boundary_convention` on each Product, which is why two sources of this
    variable can legitimately differ.
  standard_name: CF:air_temperature
  standard_name_authority: CF Standard Name Table v85
  units_ucum: Cel
  units_display: "°C"
  value_data_type: continuous_numeric
  extensivity: intensive
  default_aggregation_method: mean
  plausible_min: -70.0
  plausible_max: 60.0
  concept_mappings:
  - ENVO:09200001
  - ECTO:9000001
  omop_concept_binding:
    omop_concept_id: 3020891
    omop_concept_name: Body temperature
    omop_vocabulary_id: LOINC
    omop_domain_id: Measurement
    omop_standard_concept: S
    # Honest: this is the closest existing concept and it is wrong — it is a
    # clinical body temperature, not an ambient one. Recorded as a candidate
    # so the gap is visible rather than silently accepted.
    concept_status: candidate_mapping
  envar_variable_family: heat

- id: amadeus:var/pm25_mass_concentration
  name: pm25_mass_concentration
  label: PM2.5 mass concentration in ambient air
  standard_name: CF:mass_concentration_of_pm2p5_ambient_aerosol_particles_in_air
  standard_name_authority: CF Standard Name Table v85
  units_ucum: ug/m3
  units_display: "µg/m³"
  value_data_type: continuous_numeric
  extensivity: intensive
  default_aggregation_method: mean
  plausible_min: 0.0
  plausible_max: 1000.0
  concept_mappings:
  - ENVO:01000415
  omop_concept_binding:
    omop_concept_id: 4353936
    omop_concept_name: Particulate matter
    omop_vocabulary_id: SNOMED
    omop_domain_id: Observation
    omop_standard_concept: S
    concept_status: mapped_nonstandard
  envar_variable_family: air_quality

- id: amadeus:var/smoke_plume_density_class
  name: smoke_plume_density_class
  label: Wildfire smoke plume density class
  description: >-
    NOAA HMS ordinal smoke density (light / medium / heavy). Categorical, so no
    plausible numeric range and no mean — `mode` is the only sensible spatial
    aggregation.
  standard_name: AMADEUS:smoke_plume_density_class
  units_ucum: "1"
  value_data_type: categorical
  extensivity: categorical
  default_aggregation_method: mode
  concept_mappings:
  - ENVO:02500078
  envar_variable_family: air_quality

- id: amadeus:var/population_count
  name: population_count
  label: Resident population count
  description: >-
    Number of people. The canonical extensive variable: it scales with the size
    of its support, so a buffer aggregation must SUM, and a mean is meaningless.
  standard_name: AMADEUS:population_count
  units_ucum: "1"
  value_data_type: count
  extensivity: extensive
  default_aggregation_method: sum
  plausible_min: 0.0
  plausible_max: 100000000.0
  envar_variable_family: population

- id: amadeus:var/land_cover_class
  name: land_cover_class
  label: NLCD land cover class
  standard_name: AMADEUS:nlcd_land_cover_class
  units_ucum: "1"
  value_data_type: categorical
  extensivity: categorical
  default_aggregation_method: class_proportion
  concept_mappings:
  - ENVO:00000428
  envar_variable_family: land_use

