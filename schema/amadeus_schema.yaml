    definition_uri: https://w3id.org/niehs/amadeus/AmadeusDatabase
    description: 'Container for a complete or partial AmadeusDB instance. Exists so
      a catalog snapshot, a sample dataset or an import bundle can be validated as
      one document with `linkml-validate`, and so the SQL generator has a root from
      which to reach every table.

      All collections are optional: a catalog-only bundle (the normal shape of a curation
      pull request) is as valid as a full instance.'
    title: Amadeus Database
    from_schema: https://w3id.org/niehs/amadeus
    slots:
    - schema_version
    - data_sources
    - products
    - grid_definitions
    - canonical_variables
    - product_variables
    - assets
    - station_observations
    - grid_cell_values
    - area_values
    - hex_cell_values
    - vector_features
    - location_sets
    - locations
    - extraction_requests
    - ambient_values_at_location
    - tool_runs
    - provenance_chains
    class_uri: amadeus:AmadeusDatabase
    tree_root: true
  DataSource:
    name: DataSource
    definition_uri: https://w3id.org/niehs/amadeus/DataSource
    description: 'A provider programme that publishes one or more products: EPA AQS,
      NASA MODIS, NOAA NARR, Climatology Lab. One row per row of the amadeus README
      source table.'
    title: Data Source
    from_schema: https://w3id.org/niehs/amadeus/catalog
    exact_mappings:
    - hew:HEWResource
    slots:
    - id
    - DataSource_name
    - label
    - description
    - producer_institution
    - homepage
    - access_protocol
    - requires_authentication
    - auth_mechanism
    - rate_limit_requests_per_second
    - license_spdx
    - citation_apa
    - doi
    - DataSource_amadeus_function_suffix
    slot_usage:
      name:
        name: name
        examples:
        - value: epa_aqs
        - value: noaa_ncep_narr
        required: true
      amadeus_function_suffix:
        name: amadeus_function_suffix
        examples:
        - value: _narr
        - value: _aqs
    class_uri: amadeus:DataSource
  Product:
    name: Product
    definition_uri: https://w3id.org/niehs/amadeus/Product
    description: "A specific, versioned data product from a source \u2014 the unit\
      \ a user actually requests, and the unit that carries the *profile*: spatial\
      \ support, temporal support, format, calendar, day boundary.\nThis is where\
      \ the answer to \"do we need different schemas for different types of source\
      \ data?\" lives. We do not. The variation across the amadeus catalog decomposes\
      \ into five orthogonal axes recorded here (`spatial_support_type`, `temporal_resolution`,\
      \ `value` kind via the variables, `native_format`, and extensivity via the variables).\
      \ One schema, one product table; a MODIS swath and an AQS monitor differ in\
      \ their *values on these axes*, not in their structure."
    title: Product
    from_schema: https://w3id.org/niehs/amadeus/catalog
    exact_mappings:
    - hew:DatasetResource
    - envar:SourceDataset
    slots:
    - id
    - Product_name
    - label
    - description
    - Product_data_source
    - product_version
    - data_genre
    - native_format
    - Product_spatial_support_type
    - Product_grid_definition
    - crs
    - srid
    - spatial_extent_bbox_wkt
    - spatial_extent_descriptor
    - native_spatial_resolution_m
    - native_spatial_resolution_descriptor
    - Product_temporal_resolution
    - temporal_resolution_iso
    - temporal_alignment
    - day_boundary_convention
    - calendar
    - temporal_coverage_start
    - temporal_coverage_end
    - update_cadence_iso
    - typical_latency_iso
    - default_data_status
    - homogenisation_status
    - doi
    - license_spdx
    - citation_apa
    - access_url
    - amadeus_dataset_name
    - amadeus_process_covariate
    - amadeus_calculate_covariate
    - supports_server_side_subset
    - stac_collection_id
    slot_usage:
      name:
        name: name
        required: true
      data_source:
        name: data_source
        required: true
      spatial_support_type:
        name: spatial_support_type
        required: true
      temporal_resolution:
        name: temporal_resolution
        required: true
      grid_definition:
        name: grid_definition
        description: "Required when `spatial_support_type` is a grid cell type, forbidden\
          \ otherwise. Enforced by the rules below rather than by two separate classes\
          \ \u2014 the project lead's \"grid size is a dataset-level property\" becomes\
          \ a foreign key, not a copied field."
    class_uri: amadeus:Product
    rules:
    - preconditions:
        slot_conditions:
          spatial_support_type:
            name: spatial_support_type
            any_of:
            - equals_string: raster_grid_cell
            - equals_string: model_grid_cell
      postconditions:
        slot_conditions:
          grid_definition:
            name: grid_definition
            required: true
      description: A gridded product must declare its grid. Without this, "1 km" lives
        in a description string and no query can reason about resolution.
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: daily
      postconditions:
        slot_conditions:
          day_boundary_convention:
            name: day_boundary_convention
            required: true
      description: "A daily product must declare where its day starts. This rule alone\
        \ would have caught the Daymet/GridMET 1.26 \xB0C discrepancy at registration\
        \ time."
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: timeless
      postconditions:
        slot_conditions:
          temporal_coverage_start:
            name: temporal_coverage_start
            value_presence: ABSENT
      description: "A timeless product (GMTED elevation, K\xF6ppen-Geiger) asserts\
        \ no temporal coverage start. Modelled as absence rather than a sentinel date."
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: timeless
      postconditions:
        slot_conditions:
          temporal_coverage_end:
            name: temporal_coverage_end
            value_presence: ABSENT
      description: A timeless product asserts no temporal coverage end.
  GridDefinition:
    name: GridDefinition
    definition_uri: https://w3id.org/niehs/amadeus/GridDefinition
    description: A reusable description of a raster or model grid. Its own entity
      because several products share one grid (all NARR monolevel variables) and because
      resolution, projection and vertical levels must be computable, not prose.
    title: Grid Definition
    from_schema: https://w3id.org/niehs/amadeus/catalog
    slots:
    - id
    - name
    - label
    - GridDefinition_crs
    - srid
    - grid_mapping_name
    - proj_string
    - GridDefinition_resolution_x
    - GridDefinition_resolution_y
    - resolution_unit
    - n_columns
    - n_rows
    - origin_x
    - origin_y
    - vertical_level_type
    - vertical_level_unit
    - GridDefinition_vertical_levels
    slot_usage:
      crs:
        name: crs
        required: true
      resolution_x:
        name: resolution_x
        required: true
      resolution_y:
        name: resolution_y
        required: true
      vertical_levels:
        name: vertical_levels
        description: The pressure or height levels present, when the product is multi-level.
          NARR and MERRA-2/GEOS pressure-level products encode the level in the `terra`
          layer name (`variable_level_YYYYMMDD`); recording the level set here is
          what lets that be parsed reliably instead of positionally.
    class_uri: amadeus:GridDefinition
  CanonicalVariable:
    name: CanonicalVariable
    definition_uri: https://w3id.org/niehs/amadeus/CanonicalVariable
    description: 'A harmonised environmental quantity, independent of who publishes
      it. The cross-source identity anchor: `gridmet.tmmx`, `prism.tmax` and `daymet.tmax`
      are three `ProductVariable`s over *one* `CanonicalVariable`, and that is what
      makes "is it the same variable?" answerable by a join rather than by a conversation.

      Carries the semantics that must be identical across sources (`standard_name`,
      canonical units, extensivity, plausible range, concept bindings). Everything
      that legitimately differs per source lives on `ProductVariable`.'
    title: Canonical Variable
    from_schema: https://w3id.org/niehs/amadeus/catalog
    exact_mappings:
    - hew:EnvironmentalVariable
    - envar:VariableIdentity
    slots:
    - id
    - CanonicalVariable_name
    - label
    - description
    - CanonicalVariable_standard_name
    - standard_name_authority
    - CanonicalVariable_units_ucum
    - units_display
    - CanonicalVariable_value_data_type
    - CanonicalVariable_extensivity
    - default_aggregation_method
    - plausible_min
    - plausible_max
    - concept_mappings
    - omop_concept_binding
    - envar_variable_family
    slot_usage:
      name:
        name: name
        examples:
        - value: air_temperature_daily_maximum
        - value: pm25_mass_concentration
        required: true
      standard_name:
        name: standard_name
        required: true
      units_ucum:
        name: units_ucum
        required: true
      value_data_type:
        name: value_data_type
        required: true
      extensivity:
        name: extensivity
        required: true
    class_uri: amadeus:CanonicalVariable
    rules:
    - preconditions:
        slot_conditions:
          value_data_type:
            name: value_data_type
            equals_string: categorical
      postconditions:
        slot_conditions:
          extensivity:
            name: extensivity
            equals_string: categorical
      description: A categorical value must declare categorical extensivity.
    - preconditions:
        slot_conditions:
          extensivity:
            name: extensivity
            equals_string: categorical
      postconditions:
        slot_conditions:
          plausible_min:
            name: plausible_min
            value_presence: ABSENT
      description: A plausible numeric minimum is meaningless for a nominal class
        label.
    - preconditions:
        slot_conditions:
          extensivity:
            name: extensivity
            equals_string: categorical
      postconditions:
        slot_conditions:
          plausible_max:
            name: plausible_max
            value_presence: ABSENT
      description: A plausible numeric maximum is meaningless for a nominal class
        label.
  ProductVariable:
    name: ProductVariable
    definition_uri: https://w3id.org/niehs/amadeus/ProductVariable
    description: "One source's delivery of one canonical variable: the native name,\
      \ the native units and conversion, the CF metadata, the aggregation actually\
      \ applied, and the layer-name template amadeus parses.\nEvery slot here exists\
      \ because it is a reason two sources of \"the same\" variable are not interchangeable.\
      \ `native_units_ucum` + `native_value_scale_factor` + `native_value_offset`\
      \ are the gridMET Kelvin\u2192Celsius case, where the conversion happened at\
      \ render time and was recorded nowhere."
    title: Product Variable
    from_schema: https://w3id.org/niehs/amadeus/catalog
    exact_mappings:
    - envar:VariableIdentity
    slots:
    - id
    - ProductVariable_product
    - ProductVariable_canonical_variable
    - ProductVariable_native_name
    - label
    - native_units_ucum
    - native_value_scale_factor
    - native_value_offset
    - unit_conversion_formula
    - cf_standard_name
    - cf_cell_methods
    - aggregation_method
    - aggregation_window_iso
    - temporal_alignment
    - vertical_level_type
    - missing_value_sentinel
    - quality_flag_vocabulary
    - ProductVariable_layer_name_template
    - amadeus_variable_code
    - ProductVariable_value_data_type
    - ProductVariable_extensivity
    - harmonization_note
    - metadata_gaps
    slot_usage:
      product:
        name: product
        required: true
      canonical_variable:
        name: canonical_variable
        required: true
      native_name:
        name: native_name
        examples:
        - value: weasd
        - value: tmmx
        - value: '88101'
        required: true
      layer_name_template:
        name: layer_name_template
        examples:
        - value: '{native_name}_{YYYYMMDD}'
        - value: '{native_name}_{level}_{YYYYMMDD}'
        - value: '{native_name}_{YYYYMMDD}_{HHMMSS}'
      value_data_type:
        name: value_data_type
        description: "Optional override. Absent means \"as the canonical variable\
          \ declares\". Present means this source genuinely differs \u2014 e.g. a\
          \ source that publishes a binary exceedance flag for a quantity that is\
          \ continuous elsewhere."
      extensivity:
        name: extensivity
        description: Optional override, same semantics as `value_data_type`. Overriding
          it is a strong signal something is wrong and should be reviewed.
    class_uri: amadeus:ProductVariable
    rules:
    - preconditions:
        slot_conditions:
          native_value_scale_factor:
            name: native_value_scale_factor
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          native_units_ucum:
            name: native_units_ucum
            required: true
      description: A scale factor without the unit it scales from is uninterpretable.
    - preconditions:
        slot_conditions:
          vertical_level_type:
            name: vertical_level_type
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          layer_name_template:
            name: layer_name_template
            pattern: .*\{level\}.*
      description: A multi-level variable's layer names must carry the level, or the
        level cannot be recovered when the raster is flattened.
  OmopConceptBinding:
    name: OmopConceptBinding
    definition_uri: https://w3id.org/niehs/amadeus/OmopConceptBinding
    description: Binding of a canonical variable to an OMOP concept. Taken structurally
      from HEW so the two schemas exchange bindings without an adapter.
    title: OMOP Concept Binding
    from_schema: https://w3id.org/niehs/amadeus/catalog
    exact_mappings:
    - hew:OMOPConceptBinding
    slots:
    - omop_concept_id
    - omop_concept_name
    - omop_vocabulary_id
    - omop_domain_id
    - omop_standard_concept
    - OmopConceptBinding_concept_status
    slot_usage:
      concept_status:
        name: concept_status
        required: true
    class_uri: amadeus:OmopConceptBinding
  Asset:
    name: Asset
    definition_uri: https://w3id.org/niehs/amadeus/Asset
    description: "A concrete byte stream: a file on disk, an object in a bucket, a\
      \ STAC asset, or a provider API response. The unit of download, caching, integrity\
      \ checking and idempotency.\n**Asset-centric by design.** The modernization\
      \ plan's own instruction is \"adopt an asset-centric schema; avoid mandatory\
      \ cell-row ingestion\". An asset can be registered \u2014 catalogued, discoverable,\
      \ queryable by extent and time \u2014 without any of its values ever being materialised\
      \ into a value table. `materialization_mode` records how much was actually read,\
      \ so the four streaming modes of plan \xA74.7.2 become auditable properties\
      \ of the catalog rather than an ungoverned side path."
    title: Asset
    from_schema: https://w3id.org/niehs/amadeus/catalog
    slots:
    - id
    - Asset_product
    - asset_key
    - Asset_url
    - Asset_local_path
    - media_type
    - native_format
    - size_bytes
    - sha256
    - source_last_modified
    - download_timestamp_utc
    - valid_time_start
    - valid_time_end
    - reference_time
    - bbox_wkt
    - srid
    - variables_present
    - vertical_levels_present
    - stac_collection_id
    - stac_item_id
    - Asset_materialization_mode
    - cache_expires_at
    - Asset_value_state
    - produced_by_run
    slot_usage:
      product:
        name: product
        required: true
      materialization_mode:
        name: materialization_mode
        required: true
      value_state:
        name: value_state
        required: true
      url:
        name: url
        description: Where the bytes live upstream. Retained even after local caching
          so a result can be re-derived from source.
      local_path:
        name: local_path
        description: Present only when bytes were actually written locally. Absent
          for `direct_remote_scan` and `server_side_subset`.
    class_uri: amadeus:Asset
    rules:
    - preconditions:
        slot_conditions:
          materialization_mode:
            name: materialization_mode
            any_of:
            - equals_string: bounded_cache
            - equals_string: full_materialization
      postconditions:
        slot_conditions:
          local_path:
            name: local_path
            required: true
          sha256:
            name: sha256
            required: true
      description: "Anything cached or fully downloaded must record where it went\
        \ and what it hashes to \u2014 otherwise \"resumable, idempotent processing\"\
        \ is not checkable."
    - preconditions:
        slot_conditions:
          value_state:
            name: value_state
            equals_string: materialized
      postconditions:
        slot_conditions:
          produced_by_run:
            name: produced_by_run
            required: true
      description: If values were written into a value table, the run that wrote them
        must be identified. This is the link that makes every derived number resolve
        to a processing run (objective O-02).
  AmbientValue:
    name: AmbientValue
    definition_uri: https://w3id.org/niehs/amadeus/AmbientValue
    description: "One value of one variable, at one place, over one time interval,\
      \ from one asset, produced by one run. A property of the environment; not an\
      \ exposure.\nAbstract: no table of its own. The SQL generator flattens these\
      \ slots into each concrete child, which is the right physical design \u2014\
      \ a single polymorphic value table with mostly-null geometry columns would defeat\
      \ both partitioning and spatial indexing."
    title: Ambient Value
    from_schema: https://w3id.org/niehs/amadeus/value
    abstract: true
    slots:
    - id
    - AmbientValue_product_variable
    - AmbientValue_canonical_variable
    - asset
    - processing_run
    - AmbientValue_value
    - value_unit_ucum
    - native_value
    - native_value_unit_ucum
    - AmbientValue_valid_time_start
    - valid_time_end
    - reference_time
    - retrieval_time_utc
    - vertical_level
    - vertical_level_unit
    - quality_flag
    - AmbientValue_data_status
    - AmbientValue_source_system
    - source_version
    - AmbientValue_null_semantics
    - superseded_by
    slot_usage:
      product_variable:
        name: product_variable
        description: "Which source delivery this is. Carries the native units, the\
          \ CF metadata and the aggregation \u2014 so the row does not have to."
        required: true
      canonical_variable:
        name: canonical_variable
        description: Denormalised from `product_variable` on purpose. Cross-source
          queries ("all daily maximum temperature within this polygon") are the common
          case, and making them a two-hop join is a performance tax on the query the
          whole architecture exists to serve.
        required: true
      value:
        name: value
        description: The value in the canonical variable's units. Null when `null_semantics`
          explains why.
      valid_time_start:
        name: valid_time_start
        required: true
      data_status:
        name: data_status
        description: 'Per-row, not per-product. The AQS/AirNow rule requires it: a
          preliminary AirNow value and a quality-controlled AQS value for the same
          monitor, parameter and hour must be able to coexist as distinct rows.'
        required: true
      source_system:
        name: source_system
        required: true
      null_semantics:
        name: null_semantics
        required: true
    class_uri: amadeus:AmbientValue
    rules:
    - preconditions:
        slot_conditions:
          value:
            name: value
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          null_semantics:
            name: null_semantics
            any_of:
            - equals_string: structural_null
            - equals_string: derived_null
      description: A missing value must say why it is missing. Prevents the failure
        mode where nodata and a genuine zero are indistinguishable downstream.
    - preconditions:
        slot_conditions:
          null_semantics:
            name: null_semantics
            equals_string: true_zero
      postconditions:
        slot_conditions:
          value:
            name: value
            required: true
      description: A true zero is a present value, not an absence.
    - preconditions:
        slot_conditions:
          data_status:
            name: data_status
            equals_string: forecast
      postconditions:
        slot_conditions:
          reference_time:
            name: reference_time
            required: true
      description: A forecast is meaningless without its initialisation time. HRRR's
        "cycle and forecast-hour identity" requirement, enforced.
    - preconditions:
        slot_conditions:
          data_status:
            name: data_status
            equals_string: superseded
      postconditions:
        slot_conditions:
          superseded_by:
            name: superseded_by
            required: true
      description: A superseded row points at its replacement. Revisions create new
        records; they never mutate or delete old ones.
  StationObservation:
    name: StationObservation
    definition_uri: https://w3id.org/niehs/amadeus/StationObservation
    description: "A value from a fixed instrument with a persistent identity: EPA\
      \ AQS, AirNow, IMPROVE, USGS water sites.\nThe distinguishing feature is not\
      \ the point geometry \u2014 it is that the *instrument* is an entity with a\
      \ history. Monitors move, get replaced, and report the same parameter through\
      \ several collocated units (the AQS POC). A grid cell has none of that. Collapsing\
      \ stations into a generic point table loses the keys that make a revision traceable."
    title: Station Observation
    from_schema: https://w3id.org/niehs/amadeus/value
    is_a: AmbientValue
    slots:
    - id
    - AmbientValue_product_variable
    - AmbientValue_canonical_variable
    - asset
    - processing_run
    - AmbientValue_value
    - value_unit_ucum
    - native_value
    - native_value_unit_ucum
    - AmbientValue_valid_time_start
    - valid_time_end
    - reference_time
    - retrieval_time_utc
    - vertical_level
    - vertical_level_unit
    - quality_flag
    - AmbientValue_data_status
    - AmbientValue_source_system
    - source_version
    - AmbientValue_null_semantics
    - superseded_by
    - StationObservation_station_id
    - station_name
    - monitor_id
    - parameter_code
    - StationObservation_poc
    - sampling_duration_iso
    - StationObservation_station_geom_wkt
    - srid
    - elevation_m
    - StationObservation_station_valid_from
    - station_valid_to
    slot_usage:
      station_id:
        name: station_id
        required: true
      station_geom_wkt:
        name: station_geom_wkt
        required: true
      poc:
        name: poc
        description: "Parameter Occurrence Code \u2014 which of several collocated\
          \ monitors measuring the same parameter this is. Part of the AQS primary\
          \ key and routinely dropped by naive ingests, which then silently pick one\
          \ monitor per site."
      station_valid_from:
        name: station_valid_from
        description: Station moves are modelled as a validity interval on the observation's
          station identity rather than by mutating the station. "Station moves/POC
          changes" is a named edge case in the plan's test matrix.
    class_uri: amadeus:StationObservation
  GridCellValue:
    name: GridCellValue
    definition_uri: https://w3id.org/niehs/amadeus/GridCellValue
    description: "A value at one cell of one grid \u2014 the flattened form of a raster\
      \ layer. This is the class the SedonaDB decision hangs on: Sedona's raster support\
      \ is thinner than `terra`'s, so the plan's proposal is to flatten raster to\
      \ point or polygon and persist as GeoParquet.\nThe cell is identified *twice*:\
      \ by integer grid index (`cell_x`, `cell_y`) and by geometry. The index is the\
      \ cheap, exact, join-stable key and the one to partition and deduplicate on;\
      \ the geometry is what spatial predicates need. Storing only geometry makes\
      \ idempotent re-ingestion a floating-point comparison, which is how duplicate\
      \ rows appear."
    title: Grid Cell Value
    from_schema: https://w3id.org/niehs/amadeus/value
    is_a: AmbientValue
    slots:
    - id
    - AmbientValue_product_variable
    - AmbientValue_canonical_variable
    - asset
    - processing_run
    - AmbientValue_value
    - value_unit_ucum
    - native_value
    - native_value_unit_ucum
    - AmbientValue_valid_time_start
    - valid_time_end
    - reference_time
    - retrieval_time_utc
    - vertical_level
    - vertical_level_unit
    - quality_flag
    - AmbientValue_data_status
    - AmbientValue_source_system
    - source_version
    - AmbientValue_null_semantics
    - superseded_by
    - GridCellValue_grid_definition
    - GridCellValue_cell_x
    - GridCellValue_cell_y
    - GridCellValue_cell_centroid_wkt
    - GridCellValue_cell_polygon_wkt
    - srid
    slot_usage:
      grid_definition:
        name: grid_definition
        required: true
      cell_x:
        name: cell_x
        required: true
      cell_y:
        name: cell_y
        required: true
      cell_centroid_wkt:
        name: cell_centroid_wkt
        required: true
      cell_polygon_wkt:
        name: cell_polygon_wkt
        description: 'The cell footprint. Optional: needed for area-weighted extraction
          and for honest polygon intersection, redundant for nearest-cell lookup.
          Materialising it for a continental hourly grid is expensive, so this is
          a deliberate per-product choice, not a default.'
    class_uri: amadeus:GridCellValue
    unique_keys:
      cell_observation:
        unique_key_name: cell_observation
        unique_key_slots:
        - product_variable
        - grid_definition
        - cell_x
        - cell_y
        - vertical_level
        - valid_time_start
        - source_system
        - data_status
        description: "One value per variable, cell, level and valid time \u2014 per\
          \ source system and status, so an AirNow revision does not collide with\
          \ the AQS-equivalent row."
  AreaValue:
    name: AreaValue
    definition_uri: https://w3id.org/niehs/amadeus/AreaValue
    description: 'A value attached to a named or delineated polygon: HUC watersheds,
      EPA ecoregions, county-level NEI emissions, USDM drought polygons, NOAA HMS
      smoke plumes.

      Two sub-cases that must not be merged, distinguished by `area_role`: an *administrative*
      area whose identity is external and stable (a county FIPS), and an *episodic*
      polygon that exists only because something happened there (a smoke plume on
      one day). Aggregating across the second as if it were the first produces nonsense.'
    title: Area Value
    from_schema: https://w3id.org/niehs/amadeus/value
    is_a: AmbientValue
    slots:
    - id
    - AmbientValue_product_variable
    - AmbientValue_canonical_variable
    - asset
    - processing_run
    - AmbientValue_value
    - value_unit_ucum
    - native_value
    - native_value_unit_ucum
    - AmbientValue_valid_time_start
    - valid_time_end
    - reference_time
    - retrieval_time_utc
    - vertical_level
    - vertical_level_unit
    - quality_flag
    - AmbientValue_data_status
    - AmbientValue_source_system
    - source_version
    - AmbientValue_null_semantics
    - superseded_by
    - AreaValue_area_id
    - AreaValue_area_type
    - AreaValue_area_role
    - area_code
    - area_name
    - AreaValue_area_geom_wkt
    - srid
    - AreaValue_area_km2
    slot_usage:
      area_id:
        name: area_id
        required: true
      area_type:
        name: area_type
        required: true
      area_role:
        name: area_role
        required: true
      area_geom_wkt:
        name: area_geom_wkt
        required: true
      area_km2:
        name: area_km2
        description: Materialised area. Needed to make extensive values (an emission
          mass) convertible to intensive ones (a flux density) without recomputing
          geodesic area per query.
    class_uri: amadeus:AreaValue
  HexCellValue:
    name: HexCellValue
    definition_uri: https://w3id.org/niehs/amadeus/HexCellValue
    description: "A value aggregated to an H3 cell \u2014 the harmonization target\
      \ for the C-HER collaboration (objective O-09).\nHexification is lossy and the\
      \ loss must be recorded, not assumed. Three slots do that: `source_support_type`\
      \ (what was aggregated), `coverage_fraction` (how much of the hex the source\
      \ actually covered) and `hexification_method` (how). A hex value whose provenance\
      \ says \"area_weighted_mean from raster_grid_cell at 0.62 coverage\" is usable;\
      \ the same number without them is not."
    title: Hex Cell Value
    from_schema: https://w3id.org/niehs/amadeus/value
    is_a: AmbientValue
    slots:
    - id
    - AmbientValue_product_variable
    - AmbientValue_canonical_variable
    - asset
    - processing_run
    - AmbientValue_value
    - value_unit_ucum
    - native_value
    - native_value_unit_ucum
    - AmbientValue_valid_time_start
    - valid_time_end
    - reference_time
    - retrieval_time_utc
    - vertical_level
    - vertical_level_unit
    - quality_flag
    - AmbientValue_data_status
    - AmbientValue_source_system
    - source_version
    - AmbientValue_null_semantics
    - superseded_by
    - HexCellValue_h3_cell
    - HexCellValue_h3_resolution
    - hex_centroid_wkt
    - srid
    - HexCellValue_source_support_type
    - HexCellValue_hexification_method
    - HexCellValue_coverage_fraction
    - contributing_cell_count
    slot_usage:
      h3_cell:
        name: h3_cell
        required: true
      h3_resolution:
        name: h3_resolution
        required: true
      hexification_method:
        name: hexification_method
        required: true
      source_support_type:
        name: source_support_type
        required: true
      coverage_fraction:
        name: coverage_fraction
        required: true
    class_uri: amadeus:HexCellValue
    rules:
    - preconditions:
        slot_conditions:
          coverage_fraction:
            name: coverage_fraction
            maximum_value: 0.5
      postconditions:
        slot_conditions:
          quality_flag:
            name: quality_flag
            required: true
      description: A hex covered less than half by its source must be flagged. Partial
        coverage at the edge of a product's extent is the standard way a plausible-looking
        hex value turns out to be mostly nothing.
  VectorFeature:
    name: VectorFeature
    definition_uri: https://w3id.org/niehs/amadeus/VectorFeature
    description: 'A reference geometry with attributes but no measured value over
      time: SEDAC gROADS road segments, hydrography lines, building footprints.

      Deliberately **not** an `AmbientValue`. These are inputs to density and distance
      covariates, not observations, and they have no valid-time interval in any meaningful
      sense. The distinction matters because the legal operations differ: you compute
      a length or a distance from these, never a mean.'
    title: Vector Feature
    from_schema: https://w3id.org/niehs/amadeus/value
    slots:
    - id
    - VectorFeature_product
    - feature_id
    - feature_type
    - VectorFeature_geometry_type
    - VectorFeature_feature_geom_wkt
    - srid
    - feature_attributes
    - length_m
    - asset
    - processing_run
    slot_usage:
      product:
        name: product
        required: true
      feature_geom_wkt:
        name: feature_geom_wkt
        required: true
      geometry_type:
        name: geometry_type
        required: true
    class_uri: amadeus:VectorFeature
  LocationSet:
    name: LocationSet
    definition_uri: https://w3id.org/niehs/amadeus/LocationSet
    description: "A user-supplied collection of locations \u2014 the `locs` argument,\
      \ promoted to an entity. Carries the identifier field name (`locs_id`), the\
      \ CRS the user supplied, and a PHI declaration.\n`phi_status` defaults to `no_phi`\
      \ and is the gate on everything else: if a location set is flagged, results\
      \ derived from it must not be written to shared catalog tables or embedded in\
      \ an exported EnVar record, whose `phi_status` is a required field precisely\
      \ so this cannot be left implicit."
    title: Location Set
    from_schema: https://w3id.org/niehs/amadeus/request
    slots:
    - id
    - name
    - description
    - LocationSet_locs_id_field
    - LocationSet_crs
    - srid
    - geometry_type
    - location_count
    - LocationSet_phi_status
    - provided_by
    - created_at
    slot_usage:
      locs_id_field:
        name: locs_id_field
        description: Name of the user's identifier column. amadeus already takes this
          as `locs_id`; recording it means the output column names are derivable rather
          than conventional.
        examples:
        - value: site_id
        required: true
      phi_status:
        name: phi_status
        required: true
      crs:
        name: crs
        description: Declared, never assumed. `calculate_covariates()` currently reprojects
          `locs` to `crs(from)` silently; an undeclared input CRS is the most common
          way a spatial join goes quietly wrong.
        required: true
    class_uri: amadeus:LocationSet
  Location:
    name: Location
    definition_uri: https://w3id.org/niehs/amadeus/Location
    description: "One location in a set, with an optional validity interval.\n`valid_from`\
      \ / `valid_to` exist because a residential address is not timeless. Address\
      \ histories, known travel intervals and synthetic residence periods all need\
      \ them, and without them a value is joined to a place the subject may not have\
      \ occupied on that date. amadeus does not need to model *why* the interval exists\
      \ \u2014 that is the health layer's business \u2014 only to honour it in the\
      \ join."
    title: Location
    from_schema: https://w3id.org/niehs/amadeus/request
    slots:
    - id
    - Location_location_set
    - Location_location_key
    - Location_location_geom_wkt
    - srid
    - buffer_radius_m
    - valid_from
    - valid_to
    - target_geography_type
    slot_usage:
      location_set:
        name: location_set
        required: true
      location_key:
        name: location_key
        description: The user's own identifier value, preserved verbatim.
        required: true
      location_geom_wkt:
        name: location_geom_wkt
        required: true
    class_uri: amadeus:Location
  ExtractionRequest:
    name: ExtractionRequest
    definition_uri: https://w3id.org/niehs/amadeus/ExtractionRequest
    description: 'A declarative, reproducible specification of an extraction: which
      variables, over which locations, for which time window, with which buffer, aggregation,
      weighting and lags.

      The rules below are the ones that make the request *checkable before it runs*,
      which is the point. The extensivity rule in particular turns the project lead''s
      "intensive vs extensive should be explicit" from documentation into a validation
      error.'
    title: Extraction Request
    from_schema: https://w3id.org/niehs/amadeus/request
    slots:
    - id
    - name
    - ExtractionRequest_location_set
    - requested_canonical_variables
    - requested_product_variables
    - ExtractionRequest_time_window_start
    - ExtractionRequest_time_window_end
    - temporal_grouping
    - buffer_radius_m
    - ExtractionRequest_extraction_method
    - aggregation_method
    - weighting_product_variable
    - lag_days
    - target_geography_type
    - output_orientation
    - materialization_mode
    - source_priority_policy
    - status_mixing_policy
    - strict_extensivity_check
    - requested_by
    - request_timestamp_utc
    - ExtractionRequest_request_hash
    - ExtractionRequest_generated_sql
    slot_usage:
      location_set:
        name: location_set
        required: true
      time_window_start:
        name: time_window_start
        required: true
      time_window_end:
        name: time_window_end
        required: true
      extraction_method:
        name: extraction_method
        required: true
      request_hash:
        name: request_hash
        description: 'Hash over the normalised request. The idempotency key: the same
          request re-submitted resolves to the existing result set instead of recomputing
          it, and a changed request is visibly a different request.'
        required: true
      generated_sql:
        name: generated_sql
        description: "The SQL actually issued. Stored so the result is auditable against\
          \ the plan the optimiser chose, and so a user can take the query away and\
          \ run it themselves \u2014 which is the \"same contract in R, SQL, Python\
          \ or a container\" promise, made concrete."
    class_uri: amadeus:ExtractionRequest
    rules:
    - preconditions:
        slot_conditions:
          buffer_radius_m:
            name: buffer_radius_m
            minimum_value: 1.0e-06
      postconditions:
        slot_conditions:
          aggregation_method:
            name: aggregation_method
            required: true
      description: "A buffer without an aggregation method is ambiguous \u2014 there\
        \ are now many source values per location and nothing says how they combine.\
        \ amadeus's current default (`fun = \"mean\"`) is silently wrong for every\
        \ extensive variable."
    - preconditions:
        slot_conditions:
          aggregation_method:
            name: aggregation_method
            any_of:
            - equals_string: population_weighted_mean
      postconditions:
        slot_conditions:
          weighting_product_variable:
            name: weighting_product_variable
            required: true
      description: Population weighting must name the population product it weighted
        by. "Population-weighted" with no stated population raster is not reproducible.
    - preconditions:
        slot_conditions:
          status_mixing_policy:
            name: status_mixing_policy
            equals_string: allow_with_policy
      postconditions:
        slot_conditions:
          source_priority_policy:
            name: source_priority_policy
            required: true
      description: The AQS/AirNow rule, enforced at request time. Mixing preliminary
        and quality-controlled values into one result requires the user to have explicitly
        chosen a reconciliation policy. The default is to refuse.
  AmbientValueAtLocation:
    name: AmbientValueAtLocation
    definition_uri: https://w3id.org/niehs/amadeus/AmbientValueAtLocation
    description: 'The output row: an ambient value assigned to a user location for
      a time interval, with the extraction that produced it recorded alongside. This
      is what `calculate_covariates()` returns today, plus the metadata it currently
      drops.

      Not an exposure. The location may be a person''s address and the row may carry
      a cohort key, but the value is a property of the place: swap the person, keep
      the address, and it does not change.

      What today''s output has, that this keeps: location key, time, value. What today''s
      output lacks, that this adds: which product variable and which canonical variable
      (today encoded positionally in a column name like `weasd_0`), the extraction
      method and buffer actually used, how many source values contributed, coverage,
      distance to the contributing station, the quality and status of the inputs,
      and the run that produced it.'
    title: Ambient Value at Location
    from_schema: https://w3id.org/niehs/amadeus/request
    is_a: AmbientValue
    slots:
    - id
    - AmbientValue_product_variable
    - AmbientValue_canonical_variable
    - asset
    - processing_run
    - AmbientValue_value
    - value_unit_ucum
    - native_value
    - native_value_unit_ucum
    - AmbientValue_valid_time_start
    - valid_time_end
    - reference_time
    - retrieval_time_utc
    - vertical_level
    - vertical_level_unit
    - quality_flag
    - AmbientValue_data_status
    - AmbientValue_source_system
    - source_version
    - AmbientValue_null_semantics
    - superseded_by
    - AmbientValueAtLocation_location
    - AmbientValueAtLocation_extraction_request
    - buffer_radius_m
    - AmbientValueAtLocation_extraction_method
    - aggregation_method
    - AmbientValueAtLocation_contributing_value_count
    - coverage_fraction
    - AmbientValueAtLocation_distance_to_source_m
    - lag_days_applied
    - temporal_grouping
    - AmbientValueAtLocation_output_column_name
    slot_usage:
      location:
        name: location
        required: true
      extraction_request:
        name: extraction_request
        required: true
      extraction_method:
        name: extraction_method
        required: true
      contributing_value_count:
        name: contributing_value_count
        description: How many source values went into this one. A buffer mean over
          one cell and over four hundred cells are different claims; today both come
          back as an undistinguished number.
      distance_to_source_m:
        name: distance_to_source_m
        description: Distance to the contributing station, for nearest-station extraction.
          Paired with the request's max-distance setting, this is what makes a nearest-station
          assignment defensible.
      output_column_name:
        name: output_column_name
        description: "The wide-format column name this value would occupy, for backward\
          \ compatibility with existing amadeus and beethoven consumers (`weasd_0`,\
          \ `tmmx_10000`). Generated from the request, not parsed back out of it \u2014\
          \ the long form is canonical and the wide form is a projection."
    class_uri: amadeus:AmbientValueAtLocation
  ToolRun:
    name: ToolRun
    definition_uri: https://w3id.org/niehs/amadeus/ToolRun
    description: "One execution of one amadeus operation, with everything needed to\
      \ decide whether it can be trusted and whether it can be skipped.\n\"Whether\
      \ it can be skipped\" is the idempotency requirement: re-running a workflow\
      \ with the same inputs and configuration should reuse valid outputs and recover\
      \ from partial failures without silent duplication. That needs `input_file_sha256`,\
      \ `output_file_sha256`, `run_arguments` and `status` \u2014 not a timestamp\
      \ and a log line."
    title: Tool Run
    from_schema: https://w3id.org/niehs/amadeus/provenance
    mappings:
    - prov:Activity
    exact_mappings:
    - envar:ToolRun
    slots:
    - id
    - ToolRun_run_role
    - ToolRun_tool_name
    - ToolRun_tool_version
    - ToolRun_function_name
    - ToolRun_run_arguments
    - container_image_repository
    - ToolRun_container_image_digest
    - ToolRun_run_timestamp_utc
    - run_duration_seconds
    - run_environment
    - input_asset_ids
    - input_file_sha256
    - input_row_count
    - output_file_sha256
    - output_row_count
    - upstream_runs
    - ToolRun_status
    - log_excerpt
    - materialization_mode
    - ToolRun_bytes_transferred
    - request_count
    slot_usage:
      run_role:
        name: run_role
        required: true
      tool_name:
        name: tool_name
        ifabsent: string(amadeus)
        required: true
      tool_version:
        name: tool_version
        required: true
      run_timestamp_utc:
        name: run_timestamp_utc
        required: true
      status:
        name: status
        required: true
      function_name:
        name: function_name
        description: The specific amadeus function called (`download_narr`, `process_narr`,
          `calculate_narr`). More useful than `tool_name` alone, since one package
          version contains many operations with different failure modes.
      run_arguments:
        name: run_arguments
        description: The call's arguments as a JSON object string. The single field
          that decides whether a result is reproducible. Kept opaque because the argument
          sets differ per function and per source; validating them is the `ExtractionRequest`'s
          job for the calculate path, and an adapter contract test's job for the download
          path.
      container_image_digest:
        name: container_image_digest
        description: Immutable image digest, not a tag. Tags move; a digest is the
          only thing that makes "the same container" a checkable claim, and the plan
          requires digest references in run manifests.
      bytes_transferred:
        name: bytes_transferred
        description: "Network bytes for this run. The benchmark plan's acceptance\
          \ target is \"at least 75% fewer bytes transferred for a remote subset request\
          \ where the upstream format/API supports pushdown\" \u2014 which requires\
          \ this to be measured per run rather than estimated."
    class_uri: prov:Activity
    rules:
    - preconditions:
        slot_conditions:
          status:
            name: status
            equals_string: succeeded
          run_role:
            name: run_role
            any_of:
            - equals_string: process
            - equals_string: calculate
      postconditions:
        slot_conditions:
          output_row_count:
            name: output_row_count
            required: true
      description: A successful processing or calculation run must state how many
        rows it produced. Row-count parity against a frozen baseline is the cheapest
        golden-regression check there is.
    - preconditions:
        slot_conditions:
          run_role:
            name: run_role
            any_of:
            - equals_string: process
            - equals_string: calculate
            - equals_string: harmonize
      postconditions:
        slot_conditions:
          upstream_runs:
            name: upstream_runs
            required: true
      description: Anything downstream of download must name what it consumed. Without
        this the chain has a hole and provenance terminates in the wrong place.
    - preconditions:
        slot_conditions:
          status:
            name: status
            equals_string: failed
      postconditions:
        slot_conditions:
          log_excerpt:
            name: log_excerpt
            required: true
      description: A failed run must carry diagnostic output. "A failed run is diagnosable
        and can resume without corrupting accepted outputs" is an operability acceptance
        criterion, and it is unmeetable if failures record nothing.
  ProvenanceChain:
    name: ProvenanceChain
    definition_uri: https://w3id.org/niehs/amadeus/ProvenanceChain
    description: A materialised walk of `upstream_runs` from a derived value back
      to its terminus, plus what the terminus is. Stored rather than always recomputed
      because it is what an exported EnVar record carries, and because the recursive
      query is expensive to run per row at export time.
    title: Provenance Chain
    from_schema: https://w3id.org/niehs/amadeus/provenance
    exact_mappings:
    - envar:ProvenanceChain
    slots:
    - id
    - chain_steps
    - ProvenanceChain_terminus_type
    - compatibility_assertions
    slot_usage:
      terminus_type:
        name: terminus_type
        required: true
    class_uri: amadeus:ProvenanceChain
