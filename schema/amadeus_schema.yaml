        text: point
      multipoint:
        text: multipoint
      linestring:
        text: linestring
      multilinestring:
        text: multilinestring
      polygon:
        text: polygon
      multipolygon:
        text: multipolygon
      geometrycollection:
        text: geometrycollection
  TableOrientationEnum:
    name: TableOrientationEnum
    definition_uri: https://w3id.org/niehs/amadeus/TableOrientationEnum
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
