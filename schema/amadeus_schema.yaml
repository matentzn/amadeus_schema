    permissible_values:
      homogenised:
        text: homogenised
      not_homogenised:
        text: not_homogenised
      partial:
        text: partial
  AreaTypeEnum:
    name: AreaTypeEnum
    definition_uri: https://w3id.org/niehs/amadeus/AreaTypeEnum
    title: Area Type
    from_schema: https://w3id.org/niehs/amadeus/value
    permissible_values:
      county:
        text: county
      state:
        text: state
      census_tract:
        text: census_tract
      census_block_group:
        text: census_block_group
      zcta:
        text: zcta
      hydrologic_unit:
        text: hydrologic_unit
      ecoregion:
        text: ecoregion
      smoke_plume:
        text: smoke_plume
      drought_area:
        text: drought_area
      public_water_system:
        text: public_water_system
      custom:
        text: custom
  AreaRoleEnum:
    name: AreaRoleEnum
    definition_uri: https://w3id.org/niehs/amadeus/AreaRoleEnum
    description: Whether an area's identity is externally stable or episodic. Determines
      whether cross-time aggregation over the area is meaningful.
    title: Area Role
    from_schema: https://w3id.org/niehs/amadeus/value
    permissible_values:
      administrative:
        text: administrative
        description: Externally defined and stable across time (a county FIPS). Safe
          to aggregate over time; still subject to boundary revisions, which are handled
          as new areas rather than mutated ones.
      episodic:
        text: episodic
        description: The polygon exists because an event occurred (a smoke plume on
          one day). Aggregating across time is meaningless; the correct operation
          is intersection with a location.
  ProvenanceChainTerminusEnum:
    name: ProvenanceChainTerminusEnum
    definition_uri: https://w3id.org/niehs/amadeus/ProvenanceChainTerminusEnum
    from_schema: https://w3id.org/niehs/amadeus/provenance
    exact_mappings:
    - envar:ProvenanceChainTerminusEnum
    permissible_values:
      raw_source_download:
        text: raw_source_download
      remote_asset_scan:
        text: remote_asset_scan
        description: The chain bottoms out at a remote asset read in place, with nothing
          downloaded. The streaming case, which EnVar's enum does not have.
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      pre_existing_curated_dataset:
        text: pre_existing_curated_dataset
      externally_imported_dataset:
        text: externally_imported_dataset
        description: A dataset contributed from outside amadeus, whose upstream derivation
          amadeus did not perform and cannot vouch for.
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      synthetic_data:
        text: synthetic_data
