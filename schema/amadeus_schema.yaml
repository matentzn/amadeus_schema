      geodatabase:
        text: geodatabase
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      kml:
        text: kml
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      csv_station_observations:
        text: csv_station_observations
      pipe_delimited_text:
        text: pipe_delimited_text
        description: IMPROVE aerosol exports.
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      fixed_width_text:
        text: fixed_width_text
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      zarr:
        text: zarr
      parquet:
        text: parquet
      geoparquet:
        text: geoparquet
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
  DataGenreEnum:
    name: DataGenreEnum
    definition_uri: https://w3id.org/niehs/amadeus/DataGenreEnum
    description: The thematic classification already used in the amadeus README's
      source table. Promoted from prose to an enum so it can drive discovery.
    title: Data Genre
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      meteorology:
        text: meteorology
      climate:
        text: climate
      climate_classification:
        text: climate_classification
      air_pollution:
        text: air_pollution
      aerosols:
        text: aerosols
      atmosphere:
        text: atmosphere
      emissions:
        text: emissions
      chemicals:
        text: chemicals
      land_use:
        text: land_use
      agriculture:
        text: agriculture
      population:
        text: population
      hydrology:
        text: hydrology
      water:
        text: water
      elevation:
        text: elevation
      roadways:
        text: roadways
      wildfire_smoke:
        text: wildfire_smoke
      drought:
        text: drought
      satellite:
        text: satellite
      built_environment:
        text: built_environment
  AccessProtocolEnum:
    name: AccessProtocolEnum
    definition_uri: https://w3id.org/niehs/amadeus/AccessProtocolEnum
    description: How amadeus reaches a source. Determines whether subsetting can be
      pushed to the provider, which is the whole point of the "subset early" principle.
    title: Access Protocol
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      https_bulk_file:
        text: https_bulk_file
        description: Fetch whole files over HTTPS. No server-side subsetting.
      ftp:
        text: ftp
      s3_object_store:
        text: s3_object_store
      stac_api:
        text: stac_api
        description: Spatio-temporal asset search. Supports geometry/time pushdown.
      opendap:
        text: opendap
        description: Supports variable and index-range pushdown.
      thredds:
        text: thredds
      rest_api:
        text: rest_api
        description: Provider-specific API with query parameters (AQS, AirNow, USGS).
      harmony:
        text: harmony
      arcgis_service:
        text: arcgis_service
  MaterializationModeEnum:
    name: MaterializationModeEnum
    definition_uri: https://w3id.org/niehs/amadeus/MaterializationModeEnum
    annotations:
      source:
        tag: source
        value: "amadeus-nextgen-meeting-plan.pdf \xA74.7.2"
    description: "How much of a source asset had to be brought local to answer a request.\
      \ Taken verbatim from the modernization plan \xA74.7.2 so \"streaming\" is a\
      \ recorded, auditable property of a run rather than an ungoverned side path."
    title: Materialization Mode
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      direct_remote_scan:
        text: direct_remote_scan
        description: Only the required columns, row groups, ranges or tiles were read.
      server_side_subset:
        text: server_side_subset
        description: The provider API returned exactly the requested subset.
      bounded_cache:
        text: bounded_cache
        description: Selected assets or chunks cached with checksums and a reuse policy.
      full_materialization:
        text: full_materialization
        description: The complete asset was downloaded because no reliable subset
          path exists. Cost and storage must be made visible before execution.
  RunRoleEnum:
    name: RunRoleEnum
    definition_uri: https://w3id.org/niehs/amadeus/RunRoleEnum
    description: Which amadeus verb a tool run represents. The three public verbs
      plus the database-era additions.
    title: Run Role
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      download:
        text: download
      process:
        text: process
      calculate:
        text: calculate
      register:
        text: register
        description: An asset was catalogued without materialising its values.
      harmonize:
        text: harmonize
        description: Cross-source reconciliation, hexification, unit conversion.
      import:
        text: import
        description: An externally supplied dataset was brought into the catalog.
      export:
        text: export
        description: An EnVar record or analysis-ready table was emitted.
  PhiStatusEnum:
    name: PhiStatusEnum
    definition_uri: https://w3id.org/niehs/amadeus/PhiStatusEnum
    description: "Whether a location set, and anything derived from it, is protected\
      \ health information. An enum rather than a boolean for two reasons: it matches\
      \ EnVar's `phi_status` exactly, and \u2014 see `ValueMaterializationEnum` \u2014\
      \ a boolean cannot be used as a LinkML rule precondition."
    title: PHI Status
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:PhiStatusEnum
    permissible_values:
      no_phi:
        text: no_phi
      aggregated_no_phi:
        text: aggregated_no_phi
      phi_present:
        text: phi_present
  ValueMaterializationEnum:
    name: ValueMaterializationEnum
    definition_uri: https://w3id.org/niehs/amadeus/ValueMaterializationEnum
    description: "Whether an asset's values exist as rows in a value table, or the\
      \ asset is catalogued for discovery only.\n**This was a boolean and had to stop\
      \ being one.** LinkML's only equality construct in a rule precondition is `equals_string`,\
      \ which generates `{\"const\": \"true\"}` \u2014 the JSON *string* `\"true\"\
      ` \u2014 and therefore never matches the JSON boolean `true`. A rule keyed on\
      \ a boolean silently never fires. Verified 2026-09-18 on linkml 1.9.x; see REPORT.md."
    title: Value Materialization
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      registered_only:
        text: registered_only
        description: Catalogued and discoverable; no value rows written.
      materialized:
        text: materialized
        description: Value rows exist in a value table.
  StatusMixingPolicyEnum:
    name: StatusMixingPolicyEnum
    definition_uri: https://w3id.org/niehs/amadeus/StatusMixingPolicyEnum
    description: "Whether a request may combine values of different `data_status`\
      \ \u2014 in practice, AirNow preliminary alongside AQS quality-controlled. Defaults\
      \ to refusing. An enum for the same reason as `ValueMaterializationEnum`: it\
      \ is a rule precondition, and booleans cannot be."
    title: Status Mixing Policy
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      refuse:
        text: refuse
        description: Reject the request if the candidate values differ in status.
          The default, per the harmonization rule in plan section 4.6.1.
      allow_with_policy:
        text: allow_with_policy
        description: Permitted, and `source_priority_policy` must state how values
          are reconciled.
  StrictnessEnum:
    name: StrictnessEnum
    definition_uri: https://w3id.org/niehs/amadeus/StrictnessEnum
    title: Strictness
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      strict:
        text: strict
      permissive:
        text: permissive
  RunStatusEnum:
    name: RunStatusEnum
    definition_uri: https://w3id.org/niehs/amadeus/RunStatusEnum
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      succeeded:
        text: succeeded
      failed:
        text: failed
      partial:
        text: partial
      cancelled:
        text: cancelled
  GeometryTypeEnum:
    name: GeometryTypeEnum
    definition_uri: https://w3id.org/niehs/amadeus/GeometryTypeEnum
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
