name: amadeus-schema
description: "A candidate data model for the next-generation, database-backed amadeus\n\
  (\"AmadeusDB\"). Prototype for the Database-and-Schema agenda item of the\nAmadeus\
  \ Next-Generation Maintenance and Modernization plan (v1.0, 2026-09-18).\n\nFour\
  \ layers, five modules\n-------------------------\n* `amadeus_common`      types,\
  \ enums, shared slots \u2014 and the reconciliation\n                        record\
  \ against EnVar and HEW\n* `amadeus_catalog`     what data exists and what it means\n\
  \                        (DataSource \u2192 Product \u2192 ProductVariable \u2192\
  \n                        CanonicalVariable; GridDefinition; Asset)\n* `amadeus_value`\
  \       the data rows, in four spatial shapes\n                        (StationObservation,\
  \ GridCellValue, AreaValue,\n                        HexCellValue) plus VectorFeature\n\
  * `amadeus_request`     the query-first contract\n                        (LocationSet,\
  \ Location, ExtractionRequest,\n                        AmbientValueAtLocation)\n\
  * `amadeus_provenance`  ToolRun and the derivation DAG\n\nThe three load-bearing\
  \ claims\n-----------------------------\n1. **One schema, not one per source type.**\
  \ The 24 amadeus sources vary on\n   five orthogonal axes recorded on `Product`\
  \ and `CanonicalVariable`\n   (spatial support, temporal resolution, value kind,\
  \ native format,\n   extensivity), and on exactly one axis that needs a different\
  \ table: what\n   geometry identifies a value. Four value tables cover all of them.\n\
  2. **`CanonicalVariable` \u2190 `ProductVariable` answers the actual question.**\n\
  \   \"Is the schema for this variable the same as for the same variable from\n \
  \  another source?\" Yes at the canonical level, no at the product level, and\n\
  \   every reason for the difference is a slot.\n3. **Extensivity makes aggregation\
  \ checkable.** Intensive vs extensive is not\n   documentation; it is the precondition\
  \ on which aggregation methods are\n   legal, enforced by a rule on `ExtractionRequest`.\n\
  \nRelationship to the neighbouring schemas\n----------------------------------------\n\
  This model sits *between* HEW and EnVar and is designed to be projectable to\nboth,\
  \ not to replace either:\n\n    HEW Catalog    dataset grain    what exists    \
  \       \u2190 Product, DataSource roll up\n    AmadeusDB      row grain       \
  \ the values themselves  \u2190 this schema\n    EnVar          run grain      \
  \  what one number means  \u2190 Asset + ToolRun + Product project out\n\nEvery\
  \ slot that has an upstream equivalent carries `exact_mappings` to it.\nEvery enum\
  \ that extends an upstream one carries `annotations: extends` plus a\nnote on why,\
  \ so enum reconciliation is a finite list of decisions rather than\na diff. Three\
  \ things this model has that neither upstream does \u2014 per-row\n`data_status`,\
  \ `VariableExtensivityEnum`, and `GridDefinition` \u2014 are candidate\ncontributions\
  \ upward."
title: "AmadeusDB \u2014 Data Model"
see_also:
- https://monarch-initiative.github.io/linkml-microschemas-envar/overview/
- https://github.com/NIEHS/HEW_Catalog_Data_Model/tree/develop
- https://github.com/NIEHS/amadeus/issues/249
id: https://w3id.org/niehs/amadeus
version: 0.1.0
imports:
- linkml:types
- amadeus_common
- amadeus_catalog
- amadeus_value
- amadeus_request
- amadeus_provenance
license: MIT
prefixes:
  amadeus:
    prefix_prefix: amadeus
    prefix_reference: https://w3id.org/niehs/amadeus/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  envar:
    prefix_prefix: envar
    prefix_reference: https://w3id.org/linkml/microschemas/envar/
  hew:
    prefix_prefix: hew
    prefix_reference: https://w3id.org/hew/schema/
  geo:
    prefix_prefix: geo
    prefix_reference: http://www.opengis.net/ont/geosparql#
  prov:
    prefix_prefix: prov
    prefix_reference: http://www.w3.org/ns/prov#
default_prefix: amadeus
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  WktLiteral:
    name: WktLiteral
    definition_uri: https://w3id.org/niehs/amadeus/WktLiteral
    annotations:
      sql_promotion:
        tag: sql_promotion
        value: geometry
      note:
        tag: note
        value: "Verified against sedonadb 0.4.1 / DataFusion 52.5.0: `CREATE TABLE\
          \ t (g GEOMETRY)` fails with \"Unsupported SQL type GEOMETRY\" \u2014 as\
          \ do GEOGRAPHY, POINT, WKB and every parameterised spelling. DuckDB with\
          \ the spatial extension loaded does accept `GEOMETRY`, so text is a portability\
          \ choice, not a universal limit. Meanwhile `ST_SetSRID(ST_GeomFromText(text),\
          \ 4326)` in a view produces `geometry<Wkb>` and supports spatial predicates\
          \ and joins."
    description: A geometry serialised as OGC Well-Known Text. Stored as text in every
      backend; promoted to a native geometry by the generated `*_geo` views via `ST_SetSRID(ST_GeomFromText(...),
      srid)`.
    examples:
    - value: POINT (-78.8277 35.95013)
    - value: POLYGON ((-79 35, -78 35, -78 36, -79 36, -79 35))
    from_schema: https://w3id.org/niehs/amadeus/common
    typeof: string
    base: str
    uri: geo:wktLiteral
  Iso8601Duration:
    name: Iso8601Duration
    definition_uri: https://w3id.org/niehs/amadeus/Iso8601Duration
    description: An ISO 8601 duration. Used wherever the HEW catalog uses one (it
      encodes `P3D`, which EnVar's `TemporalResolutionEnum` cannot); the enum-valued
      companion slot is kept alongside for validation.
    examples:
    - value: P1D
    - value: PT1H
    from_schema: https://w3id.org/niehs/amadeus/common
    typeof: string
    base: str
    uri: xsd:duration
    pattern: ^P(?!$)(\d+Y)?(\d+M)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$
  Sha256:
    name: Sha256
    definition_uri: https://w3id.org/niehs/amadeus/Sha256
    description: A lowercase hex SHA-256 digest.
    from_schema: https://w3id.org/niehs/amadeus/common
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[0-9a-f]{64}$
  H3CellIndex:
    name: H3CellIndex
    definition_uri: https://w3id.org/niehs/amadeus/H3CellIndex
    description: An H3 cell index in its canonical 15-character lowercase hex form.
      The harmonization target for the C-HER hexification work (objective O-09).
    examples:
    - value: 8844c0a9241ffff
    from_schema: https://w3id.org/niehs/amadeus/common
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[0-9a-f]{15}$
enums:
  SpatialSupportTypeEnum:
    name: SpatialSupportTypeEnum
    definition_uri: https://w3id.org/niehs/amadeus/SpatialSupportTypeEnum
    annotations:
      extends:
        tag: extends
        value: hew:SpatialSupportTypeEnum
      extension_note:
        tag: extension_note
        value: Adds `hex_cell` (H3, required by O-09) and `line_feature` (SEDAC gROADS).
          Proposed back to HEW rather than forked.
    description: "What a single value spatially *is* \u2014 the source-side question.\
      \ Distinct from `TargetGeographyTypeEnum`, which says what a value gets attached\
      \ to. Both are needed; neither replaces the other."
    title: Spatial Support Type
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - hew:SpatialSupportTypeEnum
    permissible_values:
      point:
        text: point
        description: A dimensionless location.
      monitoring_station:
        text: monitoring_station
        description: A fixed instrument with an identity that persists across time.
      raster_grid_cell:
        text: raster_grid_cell
        description: A cell of an observational or retrieval grid.
      model_grid_cell:
        text: model_grid_cell
        description: A cell of a model or reanalysis grid.
      polygon:
        text: polygon
        description: An arbitrary polygon feature (a smoke plume, a drought area).
      administrative_area:
        text: administrative_area
        description: A governmental unit (county, state).
      statistical_area:
        text: statistical_area
        description: A statistical unit (census tract, block group, ZCTA).
      hex_cell:
        text: hex_cell
        description: A hierarchical hexagonal cell, in practice H3.
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      line_feature:
        text: line_feature
        description: A linear feature (a road segment, a stream reach).
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      other:
        text: other
  TargetGeographyTypeEnum:
    name: TargetGeographyTypeEnum
    definition_uri: https://w3id.org/niehs/amadeus/TargetGeographyTypeEnum
    description: The geography a value is delivered against, after extraction.
    title: Target Geography Type
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:TargetGeographyTypeEnum
    permissible_values:
      point_location:
        text: point_location
        description: "A coordinate pair supplied by the user. Deliberately *not* named\
          \ `point_residence` \u2014 amadeus knows nothing about residences."
      buffered_point:
        text: buffered_point
      census_block_group:
        text: census_block_group
      census_tract:
        text: census_tract
      zcta:
        text: zcta
      county:
        text: county
      state:
        text: state
      hydrologic_unit:
        text: hydrologic_unit
      h3_hex:
        text: h3_hex
      grid_cell:
        text: grid_cell
      public_water_system:
        text: public_water_system
  TemporalResolutionEnum:
    name: TemporalResolutionEnum
    definition_uri: https://w3id.org/niehs/amadeus/TemporalResolutionEnum
    annotations:
      extends:
        tag: extends
        value: envar:TemporalResolutionEnum
      extension_note:
        tag: extension_note
        value: "Adds `subhourly` (GOES ADP, HRRR sub-cycle), `multi_year_epoch` (NLCD\
          \ 2001/2006/2011/2016/2019/2021 \u2014 not a regular series) and `timeless`\
          \ (GMTED elevation, K\xF6ppen-Geiger, gROADS). Without `timeless` a third\
          \ of the amadeus catalog is unrepresentable."
    title: Temporal Resolution
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:TemporalResolutionEnum
    permissible_values:
      instantaneous:
        text: instantaneous
      subhourly:
        text: subhourly
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      hourly:
        text: hourly
      three_hourly:
        text: three_hourly
      daily:
        text: daily
      monthly:
        text: monthly
      seasonal:
        text: seasonal
      annual:
        text: annual
      multi_year_epoch:
        text: multi_year_epoch
        description: Irregularly spaced named epochs rather than a regular series.
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      timeless:
        text: timeless
        description: 'Static: the product asserts no valid time. Modelled as an unbounded
          valid interval rather than a null, so time predicates still work.'
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
  TemporalAlignmentEnum:
    name: TemporalAlignmentEnum
    definition_uri: https://w3id.org/niehs/amadeus/TemporalAlignmentEnum
    description: "Where in the aggregation window the timestamp sits. Taken from HEW,\
      \ which has it and EnVar does not \u2014 a genuine gap EnVar should close."
    title: Temporal Alignment
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - hew:TemporalAlignmentEnum
    permissible_values:
      start:
        text: start
      center:
        text: center
      end:
        text: end
      interval:
        text: interval
        description: The record carries both bounds explicitly.
      unknown:
        text: unknown
  DayBoundaryConventionEnum:
    name: DayBoundaryConventionEnum
    definition_uri: https://w3id.org/niehs/amadeus/DayBoundaryConventionEnum
    description: "Where a \"day\" starts for a daily product. This is the slot behind\
      \ the Daymet/GridMET 1.26 \xB0C discrepancy: same variable, same place, same\
      \ date, different day boundary."
    title: Day Boundary Convention
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:DayBoundaryConventionEnum
    permissible_values:
      local_midnight:
        text: local_midnight
      utc_midnight:
        text: utc_midnight
      ending_1200_gmt:
        text: ending_1200_gmt
      solar_noon_centered:
        text: solar_noon_centered
      observation_dependent:
        text: observation_dependent
      not_applicable:
        text: not_applicable
  CalendarEnum:
    name: CalendarEnum
    definition_uri: https://w3id.org/niehs/amadeus/CalendarEnum
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:CalendarEnum
    permissible_values:
      gregorian:
        text: gregorian
      proleptic_gregorian:
        text: proleptic_gregorian
      noleap:
        text: noleap
      daymet_365:
        text: daymet_365
      all_leap:
        text: all_leap
      day_360:
        text: day_360
      julian:
        text: julian
  AggregationMethodEnum:
    name: AggregationMethodEnum
    definition_uri: https://w3id.org/niehs/amadeus/AggregationMethodEnum
    annotations:
      extends:
        tag: extends
        value: hew:AggregationMethodEnum
      extension_note:
        tag: extension_note
        value: 'Adds the weighted and categorical members amadeus actually computes:
          `area_weighted_mean` (exactextractr on polygons), `population_weighted_mean`,
          `mode` and `class_proportion` (NLCD land-cover fractions), `density` (gROADS
          road density), `nearest` (point lookup).'
    description: "How many values became one. Which members are *legal* for a given\
      \ variable is determined by `VariableExtensivityEnum` \u2014 see the rules on\
      \ `ExtractionRequest`."
    title: Aggregation Method
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - hew:AggregationMethodEnum
    permissible_values:
      instantaneous:
        text: instantaneous
      mean:
        text: mean
      minimum:
        text: minimum
      maximum:
        text: maximum
      median:
        text: median
      sum:
        text: sum
      count:
        text: count
      percentile:
        text: percentile
      cumulative:
        text: cumulative
      area_weighted_mean:
        text: area_weighted_mean
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      population_weighted_mean:
        text: population_weighted_mean
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      mode:
        text: mode
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      class_proportion:
        text: class_proportion
        description: Fraction of the support occupied by one categorical class.
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      density:
        text: density
        description: Feature quantity per unit area.
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
      nearest:
        text: nearest
      other:
        text: other
  ExtractionMethodEnum:
    name: ExtractionMethodEnum
    definition_uri: https://w3id.org/niehs/amadeus/ExtractionMethodEnum
    description: How a value was pulled out of its source support at a location.
    title: Extraction Method
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:ExtractionMethodEnum
    permissible_values:
      nearest_cell:
        text: nearest_cell
      bilinear:
        text: bilinear
      inverse_distance_weighted_4_nearest_cells:
        text: inverse_distance_weighted_4_nearest_cells
      area_weighted_polygon_mean:
        text: area_weighted_polygon_mean
      population_weighted_mean:
        text: population_weighted_mean
      point_station_lookup:
        text: point_station_lookup
      nearest_station:
        text: nearest_station
      intersection_area_proportion:
        text: intersection_area_proportion
      raster_zonal_sum:
        text: raster_zonal_sum
      feature_density:
        text: feature_density
      exact_extract:
        text: exact_extract
        description: "`exactextractr::exact_extract` \u2014 fractional cell coverage\
          \ weighting. amadeus's default for polygon and buffered-point extraction."
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
  VariableExtensivityEnum:
    name: VariableExtensivityEnum
    definition_uri: https://w3id.org/niehs/amadeus/VariableExtensivityEnum
    annotations:
      requested_by:
        tag: requested_by
        value: Kyle Messier (2026-09-09); NIEHS/amadeus#249
      no_upstream_equivalent:
        tag: no_upstream_equivalent
        value: Neither EnVar nor HEW models extensivity. Candidate contribution from
          amadeus back up to both.
    description: "Whether a quantity is intensive (independent of the size of its\
      \ support \u2014 a temperature) or extensive (scales with it \u2014 a population\
      \ count, an emission mass). **This is the slot that makes aggregation checkable.**\
      \ Averaging an extensive variable over a buffer is a silent, plausible-looking\
      \ error; summing an intensive one is worse. Requested explicitly by the project\
      \ lead and tracked as amadeus issue #249."
    title: Variable Extensivity
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      intensive:
        text: intensive
        description: 'Value is independent of support size. Legal aggregations: mean,
          min, max, median, percentile, area/population-weighted mean, nearest.'
        annotations:
          legal_aggregations:
            tag: legal_aggregations
            value: mean,minimum,maximum,median,percentile,area_weighted_mean,population_weighted_mean,nearest,instantaneous
      extensive:
        text: extensive
        description: 'Value scales with support size; aggregation must conserve the
          total. Legal aggregations: sum, count, cumulative, raster zonal sum, density.'
        annotations:
          legal_aggregations:
            tag: legal_aggregations
            value: sum,count,cumulative,density
      categorical:
        text: categorical
        description: 'Nominal class label. Legal aggregations: mode, class_proportion.'
        annotations:
          legal_aggregations:
            tag: legal_aggregations
            value: mode,class_proportion,nearest
      unknown:
        text: unknown
        description: Not yet assessed. Permitted so migration does not require assessing
          every legacy variable at once, but blocks strict-mode extraction.
  ValueDataTypeEnum:
    name: ValueDataTypeEnum
    definition_uri: https://w3id.org/niehs/amadeus/ValueDataTypeEnum
    annotations:
      extends:
        tag: extends
        value: envar:DataTypeEnum
      extension_note:
        tag: extension_note
        value: Adds `proportion` (NLCD class fractions, impervious surface %).
    description: The measurement kind, not the storage type.
    title: Value Data Type
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:DataTypeEnum
    permissible_values:
      continuous_numeric:
        text: continuous_numeric
      categorical:
        text: categorical
      binary_flag:
        text: binary_flag
      count:
        text: count
      event_marker:
        text: event_marker
      proportion:
        text: proportion
        annotations:
          amadeus_extension:
            tag: amadeus_extension
            value: 'true'
  DataStatusEnum:
    name: DataStatusEnum
    definition_uri: https://w3id.org/niehs/amadeus/DataStatusEnum
    annotations:
      no_upstream_equivalent:
        tag: no_upstream_equivalent
        value: EnVar has `source_homogenisation_status` at dataset level only. This
          is per-row and is required by the harmonization rule.
    description: "The quality state of a value *as the source declares it*. Load-bearing\
      \ for the AQS/AirNow harmonization rule (plan \xA74.6.1): an AirNow preliminary\
      \ value must never overwrite an AQS quality-controlled value in place, so status\
      \ has to be carried on every row, not on the dataset."
    title: Data Status
    from_schema: https://w3id.org/niehs/amadeus/common
    permissible_values:
      preliminary:
        text: preliminary
        description: Near-real-time, unvalidated. AirNow.
      provisional:
        text: provisional
      quality_controlled:
        text: quality_controlled
        description: Passed the producer's QA process. AQS.
      final:
        text: final
      forecast:
        text: forecast
        description: Model output valid in the future relative to its reference time.
      reanalysis:
        text: reanalysis
      superseded:
        text: superseded
        description: "Replaced by a later revision. Retained rather than deleted \u2014\
          \ revisions create new records, they do not mutate old ones."
      unknown:
        text: unknown
  NullSemanticsEnum:
    name: NullSemanticsEnum
    definition_uri: https://w3id.org/niehs/amadeus/NullSemanticsEnum
    description: Why a value is absent, or why a zero is a zero.
    title: Null Semantics
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:NullSemanticsEnum
    permissible_values:
      present:
        text: present
      structural_null:
        text: structural_null
        description: The quantity cannot exist here (sea-surface temperature on land).
      derived_null:
        text: derived_null
        description: Inputs were missing so the derivation could not run.
      true_zero:
        text: true_zero
        description: A measured zero, not a missing value. The nodata-versus-zero
          edge case the plan's test matrix calls out.
  MissingReasonEnum:
    name: MissingReasonEnum
    definition_uri: https://w3id.org/niehs/amadeus/MissingReasonEnum
    description: "Why a *metadata* field is empty. Distinguishes \"the source does\
      \ not provide this\" from \"nobody has looked yet\" \u2014 the difference that\
      \ decides whether a gap is someone's task."
    title: Missing Reason
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - envar:MissingReasonEnum
    permissible_values:
      not_provided_by_source:
        text: not_provided_by_source
      available_but_not_extracted:
        text: available_but_not_extracted
        description: "It is in the source file and amadeus discards it. The Tier 1\
          \ gap \u2014 the cheapest possible win, and the one to count."
      upstream_data_not_propagated:
        text: upstream_data_not_propagated
      under_investigation:
        text: under_investigation
      not_applicable:
        text: not_applicable
  ConceptStatusEnum:
    name: ConceptStatusEnum
    definition_uri: https://w3id.org/niehs/amadeus/ConceptStatusEnum
    description: 'State of the mapping from a variable to a target vocabulary. HEW''s
      value set, which is strictly better than EnVar''s three-valued one: it keeps
      standard/non-standard apart (OMOP-critical) and "nobody looked" apart from "we
      looked and there is nothing".'
    title: Concept Status
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
    - hew:ConceptStatusEnum
    permissible_values:
      mapped_standard:
        text: mapped_standard
      mapped_nonstandard:
        text: mapped_nonstandard
      candidate_mapping:
        text: candidate_mapping
      vocabulary_gap:
        text: vocabulary_gap
      not_evaluated:
        text: not_evaluated
  NativeFormatEnum:
    name: NativeFormatEnum
    definition_uri: https://w3id.org/niehs/amadeus/NativeFormatEnum
    annotations:
      extends:
        tag: extends
        value: envar:SourceNativeFormatEnum
      extension_note:
        tag: extension_note
        value: EnVar's enum covers eight formats; the amadeus catalog ships fifteen.
          Every addition here is a format some current `download_*` function already
          handles.
    description: The format the source actually ships.
    title: Native Format
    from_schema: https://w3id.org/niehs/amadeus/common
    exact_mappings:
