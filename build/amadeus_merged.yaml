      long:
        text: long
        description: One row per variable-time-location. The database-native orientation,
          and the only one that generalises across products.
  TemporalGroupingEnum:
    name: TemporalGroupingEnum
    description: The `.by_time` argument of `calculate_covariates()`, made declarative.
    title: Temporal Grouping
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      none:
        text: none
      hour:
        text: hour
      day:
        text: day
      month:
        text: month
      year:
        text: year
  HomogenisationStatusEnum:
    name: HomogenisationStatusEnum
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:HomogenisationStatusEnum
    permissible_values:
      homogenised:
        text: homogenised
      not_homogenised:
        text: not_homogenised
      partial:
        text: partial
  AreaTypeEnum:
    name: AreaTypeEnum
    title: Area Type
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      county:
        text: county
      state:
        text: state
      census_tract:
        text: census_tract
      census_block_group:
        text: census_block_group
      zcta:
        text: zcta
      hydrologic_unit:
        text: hydrologic_unit
      ecoregion:
