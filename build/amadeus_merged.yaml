        - AmbientValue
        range: float
      native_value_unit_ucum:
        name: native_value_unit_ucum
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: string
      valid_time_start:
        name: valid_time_start
        description: Inclusive start of the interval the value is valid for. Left-closed,
          right-open by default (`[start, end)`) — declared here once so no individual
          dataset has to litigate it.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
        required: true
      valid_time_end:
        name: valid_time_end
        description: Exclusive end of the validity interval.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
      reference_time:
        name: reference_time
        description: 'Model initialisation / cycle time, distinct from valid time.
          Required for HRRR and any forecast product: "valid versus reference time"
