  Asset:
    name: Asset
    description: 'A concrete byte stream: a file on disk, an object in a bucket, a
      STAC asset, or a provider API response. The unit of download, caching, integrity
      checking and idempotency.

      **Asset-centric by design.** The modernization plan''s own instruction is "adopt
      an asset-centric schema; avoid mandatory cell-row ingestion". An asset can be
      registered — catalogued, discoverable, queryable by extent and time — without
      any of its values ever being materialised into a value table. `materialization_mode`
      records how much was actually read, so the four streaming modes of plan §4.7.2
      become auditable properties of the catalog rather than an ungoverned side path.'
    title: Asset
    from_schema: https://w3id.org/niehs/amadeus
    slots:
    - id
    - product
    - asset_key
    - url
    - local_path
    - media_type
    - native_format
    - size_bytes
    - sha256
    - source_last_modified
    - download_timestamp_utc
    - valid_time_start
    - valid_time_end
    - reference_time
    - bbox_wkt
    - srid
    - variables_present
    - vertical_levels_present
    - stac_collection_id
    - stac_item_id
    - materialization_mode
    - cache_expires_at
    - value_state
    - produced_by_run
    slot_usage:
      product:
        name: product
        required: true
      materialization_mode:
        name: materialization_mode
        required: true
      value_state:
        name: value_state
        required: true
      url:
        name: url
        description: Where the bytes live upstream. Retained even after local caching
          so a result can be re-derived from source.
      local_path:
        name: local_path
        description: Present only when bytes were actually written locally. Absent
          for `direct_remote_scan` and `server_side_subset`.
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: Asset
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      product:
        name: product
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - ProductVariable
        - Asset
        - VectorFeature
        range: Product
        required: true
      asset_key:
        name: asset_key
        description: STAC asset key or other within-item key.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: string
      url:
        name: url
        description: Where the bytes live upstream. Retained even after local caching
          so a result can be re-derived from source.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: uri
      local_path:
        name: local_path
        description: Present only when bytes were actually written locally. Absent
          for `direct_remote_scan` and `server_side_subset`.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: string
      media_type:
        name: media_type
        examples:
        - value: application/x-netcdf
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: string
      native_format:
        name: native_format
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_native_format
        owner: Asset
        domain_of:
        - Product
        - Asset
        range: NativeFormatEnum
      size_bytes:
        name: size_bytes
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: integer
      sha256:
        name: sha256
        description: SHA-256 of the byte stream, for integrity and idempotency.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: Sha256
      source_last_modified:
        name: source_last_modified
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: datetime
      download_timestamp_utc:
        name: download_timestamp_utc
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: datetime
      valid_time_start:
        name: valid_time_start
        description: Inclusive start of the interval the value is valid for. Left-closed,
          right-open by default (`[start, end)`) — declared here once so no individual
          dataset has to litigate it.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
      valid_time_end:
        name: valid_time_end
        description: Exclusive end of the validity interval.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
      reference_time:
        name: reference_time
        description: 'Model initialisation / cycle time, distinct from valid time.
          Required for HRRR and any forecast product: "valid versus reference time"
          is called out explicitly in the P0 subdaily work.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
      bbox_wkt:
        name: bbox_wkt
        description: Bounding geometry as WKT.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: WktLiteral
      srid:
        name: srid
        description: Numeric spatial reference identifier, derived from `crs`. Materialised
          because `ST_SetSRID` takes an integer and the geometry views need it without
          a lookup.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Product
        - GridDefinition
        - Asset
        - StationObservation
        - GridCellValue
        - AreaValue
        - HexCellValue
        - VectorFeature
        - LocationSet
        - Location
        range: integer
      variables_present:
        name: variables_present
        description: Which variables this asset actually contains. Lets a request
          skip assets that cannot satisfy it without opening them.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: ProductVariable
        multivalued: true
      vertical_levels_present:
        name: vertical_levels_present
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: float
        multivalued: true
      stac_collection_id:
        name: stac_collection_id
        description: STAC collection identifier, where the product is STAC-published.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Product
        - Asset
        range: string
      stac_item_id:
        name: stac_item_id
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: string
      materialization_mode:
        name: materialization_mode
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        - ExtractionRequest
        - ToolRun
        range: MaterializationModeEnum
        required: true
      cache_expires_at:
        name: cache_expires_at
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: datetime
      value_state:
        name: value_state
        description: Whether rows for this asset exist in a value table. `registered_only`
          is the normal case for the asset-centric discovery path.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: ValueMaterializationEnum
        required: true
      produced_by_run:
        name: produced_by_run
        description: Identifier of the tool run that registered or materialised this
          asset. Typed as a string rather than an object reference to keep the catalog
          and provenance modules independently loadable; the FK is added by the SQL
          post-processor.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Asset
        domain_of:
        - Asset
        range: string
    rules:
    - preconditions:
        slot_conditions:
          materialization_mode:
            name: materialization_mode
            any_of:
            - equals_string: bounded_cache
            - equals_string: full_materialization
      postconditions:
        slot_conditions:
          local_path:
            name: local_path
            required: true
          sha256:
            name: sha256
            required: true
      description: Anything cached or fully downloaded must record where it went and
        what it hashes to — otherwise "resumable, idempotent processing" is not checkable.
    - preconditions:
        slot_conditions:
          value_state:
            name: value_state
            equals_string: materialized
      postconditions:
        slot_conditions:
          produced_by_run:
            name: produced_by_run
            required: true
      description: If values were written into a value table, the run that wrote them
        must be identified. This is the link that makes every derived number resolve
        to a processing run (objective O-02).
  AmbientValue:
    name: AmbientValue
    description: 'One value of one variable, at one place, over one time interval,
      from one asset, produced by one run. A property of the environment; not an exposure.

      Abstract: no table of its own. The SQL generator flattens these slots into each
      concrete child, which is the right physical design — a single polymorphic value
      table with mostly-null geometry columns would defeat both partitioning and spatial
      indexing.'
    title: Ambient Value
    from_schema: https://w3id.org/niehs/amadeus
    abstract: true
    slots:
    - id
    - product_variable
    - canonical_variable
    - asset
    - processing_run
    - value
    - value_unit_ucum
    - native_value
    - native_value_unit_ucum
    - valid_time_start
    - valid_time_end
    - reference_time
    - retrieval_time_utc
    - vertical_level
    - vertical_level_unit
    - quality_flag
    - data_status
    - source_system
    - source_version
    - null_semantics
    - superseded_by
    slot_usage:
      product_variable:
        name: product_variable
        description: Which source delivery this is. Carries the native units, the
          CF metadata and the aggregation — so the row does not have to.
        required: true
      canonical_variable:
        name: canonical_variable
        description: Denormalised from `product_variable` on purpose. Cross-source
          queries ("all daily maximum temperature within this polygon") are the common
          case, and making them a two-hop join is a performance tax on the query the
          whole architecture exists to serve.
        required: true
      value:
        name: value
        description: The value in the canonical variable's units. Null when `null_semantics`
          explains why.
      valid_time_start:
        name: valid_time_start
        required: true
      data_status:
        name: data_status
        description: 'Per-row, not per-product. The AQS/AirNow rule requires it: a
          preliminary AirNow value and a quality-controlled AQS value for the same
          monitor, parameter and hour must be able to coexist as distinct rows.'
        required: true
      source_system:
        name: source_system
        required: true
      null_semantics:
        name: null_semantics
        required: true
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: AmbientValue
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      product_variable:
        name: product_variable
        description: Which source delivery this is. Carries the native units, the
          CF metadata and the aggregation — so the row does not have to.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: ProductVariable
        required: true
      canonical_variable:
        name: canonical_variable
        description: Denormalised from `product_variable` on purpose. Cross-source
          queries ("all daily maximum temperature within this polygon") are the common
          case, and making them a two-hop join is a performance tax on the query the
          whole architecture exists to serve.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - ProductVariable
        - AmbientValue
        range: CanonicalVariable
        required: true
      asset:
        name: asset
        description: The byte stream this value came from. Every number resolves to
          a file and a hash — half of objective O-02's "every derived output resolves
          to source assets and processing runs".
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        - VectorFeature
        range: Asset
      processing_run:
        name: processing_run
        description: Identifier of the `ToolRun` that produced this value. The other
          half of O-02. A plain string rather than an object reference so the value
          and provenance modules stay independently loadable; the SQL post-processor
          adds the foreign key.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        - VectorFeature
        range: string
      value:
        name: value
        description: The value in the canonical variable's units. Null when `null_semantics`
