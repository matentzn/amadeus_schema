  ExtractionRequest:
    name: ExtractionRequest
    description: 'A declarative, reproducible specification of an extraction: which
      variables, over which locations, for which time window, with which buffer, aggregation,
      weighting and lags.

      The rules below are the ones that make the request *checkable before it runs*,
      which is the point. The extensivity rule in particular turns the project lead''s
      "intensive vs extensive should be explicit" from documentation into a validation
      error.'
    title: Extraction Request
    from_schema: https://w3id.org/niehs/amadeus
    slots:
    - id
    - name
    - location_set
    - requested_canonical_variables
    - requested_product_variables
    - time_window_start
    - time_window_end
    - temporal_grouping
    - buffer_radius_m
    - extraction_method
    - aggregation_method
    - weighting_product_variable
    - lag_days
    - target_geography_type
    - output_orientation
    - materialization_mode
    - source_priority_policy
    - status_mixing_policy
    - strict_extensivity_check
    - requested_by
    - request_timestamp_utc
    - request_hash
    - generated_sql
    slot_usage:
      location_set:
        name: location_set
        required: true
      time_window_start:
        name: time_window_start
        required: true
      time_window_end:
        name: time_window_end
        required: true
      extraction_method:
        name: extraction_method
        required: true
      request_hash:
        name: request_hash
        description: 'Hash over the normalised request. The idempotency key: the same
          request re-submitted resolves to the existing result set instead of recomputing
          it, and a changed request is visibly a different request.'
        required: true
      generated_sql:
        name: generated_sql
        description: The SQL actually issued. Stored so the result is auditable against
          the plan the optimiser chose, and so a user can take the query away and
          run it themselves — which is the "same contract in R, SQL, Python or a container"
          promise, made concrete.
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: ExtractionRequest
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      name:
        name: name
        description: A short machine-friendly name.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - LocationSet
        - ExtractionRequest
        range: string
      location_set:
        name: location_set
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - Location
        - ExtractionRequest
        range: LocationSet
        required: true
      requested_canonical_variables:
        name: requested_canonical_variables
        description: 'Request by canonical variable to let the planner choose a source.
          The preferred form: the user asks for daily maximum temperature, not for
          `gridmet.tmmx`.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: CanonicalVariable
        multivalued: true
      requested_product_variables:
        name: requested_product_variables
        description: Request a specific source delivery, pinning the answer. Required
          when reproducing a published result, since the planner's choice may change.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: ProductVariable
        multivalued: true
      time_window_start:
        name: time_window_start
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: datetime
        required: true
      time_window_end:
        name: time_window_end
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: datetime
        required: true
      temporal_grouping:
        name: temporal_grouping
        description: The `.by_time` argument.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        - AmbientValueAtLocation
        range: TemporalGroupingEnum
      buffer_radius_m:
        name: buffer_radius_m
        description: Buffer radius in metres. Metres, explicitly — amadeus currently
          interprets `radius` in the units of the *projected* geometry's CRS, which
          for a geographic CRS means degrees, and the docs describe it as metres.
          Declaring the unit in the schema removes the ambiguity.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:extraction_buffer_m
        owner: ExtractionRequest
        domain_of:
        - Location
        - ExtractionRequest
        - AmbientValueAtLocation
        range: float
        minimum_value: 0.0
      extraction_method:
        name: extraction_method
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        - AmbientValueAtLocation
        range: ExtractionMethodEnum
        required: true
      aggregation_method:
        name: aggregation_method
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:temporal_aggregation_method
        - hew:aggregation_method
        owner: ExtractionRequest
        domain_of:
        - ProductVariable
        - ExtractionRequest
        - AmbientValueAtLocation
        range: AggregationMethodEnum
      weighting_product_variable:
        name: weighting_product_variable
        description: The product variable used as weights (a population density grid).
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: ProductVariable
      lag_days:
        name: lag_days
        description: Lags to compute, in days. `calculate_lagged()` already does this;
          naming them in the request is what lets the result carry which lag it is.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: integer
        multivalued: true
      target_geography_type:
        name: target_geography_type
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - Location
        - ExtractionRequest
        range: TargetGeographyTypeEnum
      output_orientation:
        name: output_orientation
        from_schema: https://w3id.org/niehs/amadeus
        ifabsent: string(long)
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: TableOrientationEnum
      materialization_mode:
        name: materialization_mode
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - Asset
        - ExtractionRequest
        - ToolRun
        range: MaterializationModeEnum
      source_priority_policy:
        name: source_priority_policy
        description: Ordered source preference for reconciliation, e.g. `aqs > airnow`.
          Required whenever `status_mixing_policy` is `allow_with_policy`.
        examples:
        - value: aqs>airnow
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: string
      status_mixing_policy:
        name: status_mixing_policy
        description: Whether preliminary and quality-controlled values may appear
          in one result. Defaults to refusing.
        from_schema: https://w3id.org/niehs/amadeus
        ifabsent: string(refuse)
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: StatusMixingPolicyEnum
      strict_extensivity_check:
        name: strict_extensivity_check
        description: 'Whether to reject a request whose aggregation is illegal for
          the variable''s extensivity, or whose variable declares `extensivity: unknown`.
          Defaults to on: an aggregation that cannot be justified should fail loudly
          at request time, not produce a plausible number.'
        from_schema: https://w3id.org/niehs/amadeus
        ifabsent: string(strict)
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: StrictnessEnum
      requested_by:
        name: requested_by
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: string
      request_timestamp_utc:
        name: request_timestamp_utc
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: datetime
      request_hash:
        name: request_hash
        description: 'Hash over the normalised request. The idempotency key: the same
          request re-submitted resolves to the existing result set instead of recomputing
          it, and a changed request is visibly a different request.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: Sha256
        required: true
      generated_sql:
        name: generated_sql
        description: The SQL actually issued. Stored so the result is auditable against
          the plan the optimiser chose, and so a user can take the query away and
          run it themselves — which is the "same contract in R, SQL, Python or a container"
          promise, made concrete.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ExtractionRequest
        domain_of:
        - ExtractionRequest
        range: string
    rules:
    - preconditions:
        slot_conditions:
          buffer_radius_m:
            name: buffer_radius_m
            minimum_value: 1.0e-06
      postconditions:
        slot_conditions:
          aggregation_method:
            name: aggregation_method
            required: true
      description: A buffer without an aggregation method is ambiguous — there are
        now many source values per location and nothing says how they combine. amadeus's
        current default (`fun = "mean"`) is silently wrong for every extensive variable.
    - preconditions:
        slot_conditions:
          aggregation_method:
            name: aggregation_method
            any_of:
            - equals_string: population_weighted_mean
      postconditions:
        slot_conditions:
          weighting_product_variable:
            name: weighting_product_variable
            required: true
      description: Population weighting must name the population product it weighted
        by. "Population-weighted" with no stated population raster is not reproducible.
    - preconditions:
        slot_conditions:
          status_mixing_policy:
            name: status_mixing_policy
            equals_string: allow_with_policy
      postconditions:
        slot_conditions:
          source_priority_policy:
            name: source_priority_policy
            required: true
      description: The AQS/AirNow rule, enforced at request time. Mixing preliminary
        and quality-controlled values into one result requires the user to have explicitly
        chosen a reconciliation policy. The default is to refuse.
  AmbientValueAtLocation:
    name: AmbientValueAtLocation
    description: 'The output row: an ambient value assigned to a user location for
      a time interval, with the extraction that produced it recorded alongside. This
      is what `calculate_covariates()` returns today, plus the metadata it currently
      drops.

      Not an exposure. The location may be a person''s address and the row may carry
      a cohort key, but the value is a property of the place: swap the person, keep
      the address, and it does not change.

      What today''s output has, that this keeps: location key, time, value. What today''s
      output lacks, that this adds: which product variable and which canonical variable
      (today encoded positionally in a column name like `weasd_0`), the extraction
      method and buffer actually used, how many source values contributed, coverage,
      distance to the contributing station, the quality and status of the inputs,
      and the run that produced it.'
    title: Ambient Value at Location
    from_schema: https://w3id.org/niehs/amadeus
    is_a: AmbientValue
    slots:
    - location
    - extraction_request
    - buffer_radius_m
    - extraction_method
    - aggregation_method
    - contributing_value_count
    - coverage_fraction
    - distance_to_source_m
    - lag_days_applied
    - temporal_grouping
    - output_column_name
    slot_usage:
      location:
        name: location
        required: true
      extraction_request:
        name: extraction_request
        required: true
      extraction_method:
        name: extraction_method
        required: true
      contributing_value_count:
        name: contributing_value_count
        description: How many source values went into this one. A buffer mean over
          one cell and over four hundred cells are different claims; today both come
          back as an undistinguished number.
      distance_to_source_m:
        name: distance_to_source_m
        description: Distance to the contributing station, for nearest-station extraction.
          Paired with the request's max-distance setting, this is what makes a nearest-station
          assignment defensible.
      output_column_name:
        name: output_column_name
        description: The wide-format column name this value would occupy, for backward
          compatibility with existing amadeus and beethoven consumers (`weasd_0`,
          `tmmx_10000`). Generated from the request, not parsed back out of it — the
          long form is canonical and the wide form is a projection.
    attributes:
      location:
        name: location
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValueAtLocation
        range: Location
        required: true
      extraction_request:
        name: extraction_request
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValueAtLocation
        range: ExtractionRequest
        required: true
      buffer_radius_m:
        name: buffer_radius_m
        description: Buffer radius in metres. Metres, explicitly — amadeus currently
          interprets `radius` in the units of the *projected* geometry's CRS, which
          for a geographic CRS means degrees, and the docs describe it as metres.
          Declaring the unit in the schema removes the ambiguity.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:extraction_buffer_m
        owner: AmbientValueAtLocation
        domain_of:
        - Location
        - ExtractionRequest
        - AmbientValueAtLocation
        range: float
        minimum_value: 0.0
      extraction_method:
        name: extraction_method
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - ExtractionRequest
        - AmbientValueAtLocation
        range: ExtractionMethodEnum
        required: true
      aggregation_method:
        name: aggregation_method
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:temporal_aggregation_method
        - hew:aggregation_method
        owner: AmbientValueAtLocation
        domain_of:
        - ProductVariable
        - ExtractionRequest
        - AmbientValueAtLocation
        range: AggregationMethodEnum
      contributing_value_count:
        name: contributing_value_count
        description: How many source values went into this one. A buffer mean over
          one cell and over four hundred cells are different claims; today both come
          back as an undistinguished number.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValueAtLocation
        range: integer
      coverage_fraction:
        name: coverage_fraction
        description: Fraction of the hex actually covered by contributing source support.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - HexCellValue
        - AmbientValueAtLocation
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      distance_to_source_m:
        name: distance_to_source_m
        description: Distance to the contributing station, for nearest-station extraction.
          Paired with the request's max-distance setting, this is what makes a nearest-station
          assignment defensible.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValueAtLocation
        range: float
      lag_days_applied:
        name: lag_days_applied
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValueAtLocation
        range: integer
      temporal_grouping:
        name: temporal_grouping
        description: The `.by_time` argument.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - ExtractionRequest
        - AmbientValueAtLocation
        range: TemporalGroupingEnum
      output_column_name:
        name: output_column_name
        description: The wide-format column name this value would occupy, for backward
          compatibility with existing amadeus and beethoven consumers (`weasd_0`,
          `tmmx_10000`). Generated from the request, not parsed back out of it — the
          long form is canonical and the wide form is a projection.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValueAtLocation
        range: string
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: AmbientValueAtLocation
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      product_variable:
        name: product_variable
        description: Which source delivery this is. Carries the native units, the
          CF metadata and the aggregation — so the row does not have to.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: ProductVariable
        required: true
      canonical_variable:
        name: canonical_variable
        description: Denormalised from `product_variable` on purpose. Cross-source
          queries ("all daily maximum temperature within this polygon") are the common
          case, and making them a two-hop join is a performance tax on the query the
          whole architecture exists to serve.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - ProductVariable
        - AmbientValue
        range: CanonicalVariable
        required: true
      asset:
        name: asset
        description: The byte stream this value came from. Every number resolves to
          a file and a hash — half of objective O-02's "every derived output resolves
          to source assets and processing runs".
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        - VectorFeature
        range: Asset
      processing_run:
        name: processing_run
        description: Identifier of the `ToolRun` that produced this value. The other
          half of O-02. A plain string rather than an object reference so the value
          and provenance modules stay independently loadable; the SQL post-processor
          adds the foreign key.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        - VectorFeature
        range: string
      value:
        name: value
        description: The value in the canonical variable's units. Null when `null_semantics`
          explains why.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: float
      value_unit_ucum:
        name: value_unit_ucum
        description: 'Units of `value`, denormalised from the canonical variable.
          Redundant by design: a value row that travels out of the database as CSV
          or Parquet must not lose its units on the way.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: string
      native_value:
        name: native_value
        description: The value exactly as the source shipped it, before scale, offset
          and unit conversion. Kept so a conversion bug is discoverable after the
          fact instead of being baked in irreversibly.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: float
      native_value_unit_ucum:
        name: native_value_unit_ucum
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: string
      valid_time_start:
        name: valid_time_start
        description: Inclusive start of the interval the value is valid for. Left-closed,
          right-open by default (`[start, end)`) — declared here once so no individual
          dataset has to litigate it.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
        required: true
      valid_time_end:
        name: valid_time_end
        description: Exclusive end of the validity interval.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
      reference_time:
        name: reference_time
        description: 'Model initialisation / cycle time, distinct from valid time.
          Required for HRRR and any forecast product: "valid versus reference time"
          is called out explicitly in the P0 subdaily work.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
      retrieval_time_utc:
        name: retrieval_time_utc
        description: 'When amadeus obtained the value. Required by the AQS/AirNow
          rule: with revisable sources, "when we asked" is part of the value''s identity.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: datetime
      vertical_level:
        name: vertical_level
        description: Pressure or height level for multi-level products (NARR, MERRA-2,
          GEOS-CF). Part of the value's identity, not an attribute of it.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: float
      vertical_level_unit:
        name: vertical_level_unit
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - GridDefinition
        - AmbientValue
        range: string
      quality_flag:
        name: quality_flag
        description: The source's quality flag, verbatim, interpreted against the
          `quality_flag_vocabulary` on the product variable. Never normalised on ingest
          — normalising discards information, and the vocabularies do not align.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: string
      data_status:
        name: data_status
        description: 'Per-row, not per-product. The AQS/AirNow rule requires it: a
          preliminary AirNow value and a quality-controlled AQS value for the same
          monitor, parameter and hour must be able to coexist as distinct rows.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: DataStatusEnum
        required: true
      source_system:
        name: source_system
        description: Which system supplied this row (`aqs`, `airnow`). Required on
          every row by the harmonization rule so preliminary and quality-controlled
          values for the same monitor-hour coexist rather than overwrite.
        examples:
        - value: aqs
        - value: airnow
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: string
        required: true
      source_version:
        name: source_version
        description: The source's own version or revision identifier for this value,
          where it publishes one.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: string
      null_semantics:
        name: null_semantics
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: NullSemanticsEnum
        required: true
      superseded_by:
        name: superseded_by
        description: Identifier of the row that replaces this one. Revisions append;
          they do not mutate.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValueAtLocation
        domain_of:
        - AmbientValue
        range: string
  ToolRun:
    name: ToolRun
    description: 'One execution of one amadeus operation, with everything needed to
      decide whether it can be trusted and whether it can be skipped.

      "Whether it can be skipped" is the idempotency requirement: re-running a workflow
      with the same inputs and configuration should reuse valid outputs and recover
      from partial failures without silent duplication. That needs `input_file_sha256`,
      `output_file_sha256`, `run_arguments` and `status` — not a timestamp and a log
      line.'
    title: Tool Run
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:ToolRun
    slots:
    - id
    - run_role
    - tool_name
    - tool_version
    - function_name
    - run_arguments
    - container_image_repository
    - container_image_digest
    - run_timestamp_utc
    - run_duration_seconds
    - run_environment
    - input_asset_ids
    - input_file_sha256
    - input_row_count
    - output_file_sha256
    - output_row_count
    - upstream_runs
    - status
    - log_excerpt
    - materialization_mode
    - bytes_transferred
    - request_count
    slot_usage:
      run_role:
        name: run_role
        required: true
      tool_name:
        name: tool_name
        ifabsent: string(amadeus)
        required: true
      tool_version:
        name: tool_version
        required: true
      run_timestamp_utc:
        name: run_timestamp_utc
        required: true
      status:
        name: status
        required: true
      function_name:
        name: function_name
        description: The specific amadeus function called (`download_narr`, `process_narr`,
          `calculate_narr`). More useful than `tool_name` alone, since one package
          version contains many operations with different failure modes.
      run_arguments:
        name: run_arguments
        description: The call's arguments as a JSON object string. The single field
          that decides whether a result is reproducible. Kept opaque because the argument
          sets differ per function and per source; validating them is the `ExtractionRequest`'s
          job for the calculate path, and an adapter contract test's job for the download
          path.
      container_image_digest:
        name: container_image_digest
        description: Immutable image digest, not a tag. Tags move; a digest is the
          only thing that makes "the same container" a checkable claim, and the plan
          requires digest references in run manifests.
      bytes_transferred:
        name: bytes_transferred
        description: Network bytes for this run. The benchmark plan's acceptance target
          is "at least 75% fewer bytes transferred for a remote subset request where
          the upstream format/API supports pushdown" — which requires this to be measured
          per run rather than estimated.
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: ToolRun
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      run_role:
        name: run_role
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: RunRoleEnum
        required: true
      tool_name:
        name: tool_name
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:tool_name
        ifabsent: string(amadeus)
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
        required: true
      tool_version:
        name: tool_version
        examples:
        - value: 1.3.2.1
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:tool_version
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
        required: true
      function_name:
        name: function_name
        description: The specific amadeus function called (`download_narr`, `process_narr`,
          `calculate_narr`). More useful than `tool_name` alone, since one package
          version contains many operations with different failure modes.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
      run_arguments:
        name: run_arguments
        description: The call's arguments as a JSON object string. The single field
          that decides whether a result is reproducible. Kept opaque because the argument
          sets differ per function and per source; validating them is the `ExtractionRequest`'s
          job for the calculate path, and an adapter contract test's job for the download
          path.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:run_arguments
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
      container_image_repository:
        name: container_image_repository
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:container_image_repository
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
      container_image_digest:
        name: container_image_digest
        description: Immutable image digest, not a tag. Tags move; a digest is the
          only thing that makes "the same container" a checkable claim, and the plan
          requires digest references in run manifests.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:container_image_digest
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
        pattern: ^sha256:[0-9a-f]{64}$
      run_timestamp_utc:
        name: run_timestamp_utc
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:run_timestamp_utc
        owner: ToolRun
        domain_of:
        - ToolRun
        range: datetime
        required: true
      run_duration_seconds:
        name: run_duration_seconds
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:run_duration_seconds
        owner: ToolRun
        domain_of:
        - ToolRun
        range: float
      run_environment:
        name: run_environment
        description: 'Runtime environment as a JSON object string — R version, platform,
          key package versions (`terra`, `sf`, `exactextractr`), and the database
          engine and version. The engine matters: a SedonaDB result and a DuckDB result
          of the same request are not guaranteed identical, and the capability matrix
          the plan calls for is only auditable if each run says which engine ran it.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
      input_asset_ids:
        name: input_asset_ids
        description: Assets consumed by this run.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
        multivalued: true
      input_file_sha256:
        name: input_file_sha256
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:input_file_sha256
        owner: ToolRun
        domain_of:
        - ToolRun
        range: Sha256
      input_row_count:
        name: input_row_count
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:input_row_count
        owner: ToolRun
        domain_of:
        - ToolRun
        range: integer
      output_file_sha256:
        name: output_file_sha256
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:output_file_sha256
        owner: ToolRun
        domain_of:
        - ToolRun
        range: Sha256
      output_row_count:
        name: output_row_count
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:output_row_count
        owner: ToolRun
        domain_of:
        - ToolRun
        range: integer
      upstream_runs:
        name: upstream_runs
        description: Identifiers of the runs this one consumed. The DAG edge. Typed
          as strings rather than object references so the table is self-contained
          and loadable before its own foreign keys resolve — a run may be recorded
          before its parents are fully written.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
        multivalued: true
      status:
        name: status
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: RunStatusEnum
        required: true
      log_excerpt:
        name: log_excerpt
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:run_log_excerpt
        owner: ToolRun
        domain_of:
        - ToolRun
        range: string
      materialization_mode:
        name: materialization_mode
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - Asset
        - ExtractionRequest
        - ToolRun
        range: MaterializationModeEnum
      bytes_transferred:
        name: bytes_transferred
        description: Network bytes for this run. The benchmark plan's acceptance target
          is "at least 75% fewer bytes transferred for a remote subset request where
          the upstream format/API supports pushdown" — which requires this to be measured
          per run rather than estimated.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: integer
      request_count:
        name: request_count
        description: Number of HTTP or API requests issued, for rate-limit accounting.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ToolRun
        domain_of:
        - ToolRun
        range: integer
    class_uri: prov:Activity
    rules:
    - preconditions:
        slot_conditions:
          status:
            name: status
            equals_string: succeeded
          run_role:
            name: run_role
            any_of:
            - equals_string: process
            - equals_string: calculate
      postconditions:
        slot_conditions:
          output_row_count:
            name: output_row_count
            required: true
      description: A successful processing or calculation run must state how many
        rows it produced. Row-count parity against a frozen baseline is the cheapest
        golden-regression check there is.
    - preconditions:
        slot_conditions:
          run_role:
            name: run_role
            any_of:
            - equals_string: process
            - equals_string: calculate
            - equals_string: harmonize
      postconditions:
        slot_conditions:
          upstream_runs:
            name: upstream_runs
            required: true
      description: Anything downstream of download must name what it consumed. Without
        this the chain has a hole and provenance terminates in the wrong place.
    - preconditions:
        slot_conditions:
          status:
            name: status
            equals_string: failed
      postconditions:
        slot_conditions:
          log_excerpt:
            name: log_excerpt
            required: true
      description: A failed run must carry diagnostic output. "A failed run is diagnosable
        and can resume without corrupting accepted outputs" is an operability acceptance
        criterion, and it is unmeetable if failures record nothing.
  ProvenanceChain:
    name: ProvenanceChain
    description: A materialised walk of `upstream_runs` from a derived value back
      to its terminus, plus what the terminus is. Stored rather than always recomputed
      because it is what an exported EnVar record carries, and because the recursive
      query is expensive to run per row at export time.
    title: Provenance Chain
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:ProvenanceChain
    slots:
    - id
    - chain_steps
    - terminus_type
    - compatibility_assertions
    slot_usage:
      terminus_type:
        name: terminus_type
        required: true
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: ProvenanceChain
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      chain_steps:
        name: chain_steps
        description: Run identifiers, ordered from the derived value back to the terminus.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProvenanceChain
        domain_of:
        - ProvenanceChain
        range: string
        multivalued: true
      terminus_type:
        name: terminus_type
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:provenance_chain_terminus_type
        owner: ProvenanceChain
        domain_of:
        - ProvenanceChain
        range: ProvenanceChainTerminusEnum
        required: true
      compatibility_assertions:
        name: compatibility_assertions
        description: Assertions that consecutive steps were compatible — matching
          CRS, units, calendar, day boundary. The seam between two steps belongs to
          neither step, and this is where a mismatch gets recorded instead of silently
          absorbed.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProvenanceChain
        domain_of:
        - ProvenanceChain
        range: string
