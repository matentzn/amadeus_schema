  GridCellValue:
    name: GridCellValue
    description: 'A value at one cell of one grid — the flattened form of a raster
      layer. This is the class the SedonaDB decision hangs on: Sedona''s raster support
      is thinner than `terra`''s, so the plan''s proposal is to flatten raster to
      point or polygon and persist as GeoParquet.

      The cell is identified *twice*: by integer grid index (`cell_x`, `cell_y`) and
      by geometry. The index is the cheap, exact, join-stable key and the one to partition
      and deduplicate on; the geometry is what spatial predicates need. Storing only
      geometry makes idempotent re-ingestion a floating-point comparison, which is
      how duplicate rows appear.'
