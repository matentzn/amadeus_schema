        name: created_at
        from_schema: https://w3id.org/niehs/amadeus
        owner: LocationSet
        domain_of:
        - LocationSet
        range: datetime
  Location:
    name: Location
    description: 'One location in a set, with an optional validity interval.

      `valid_from` / `valid_to` exist because a residential address is not timeless.
      Address histories, known travel intervals and synthetic residence periods all
      need them, and without them a value is joined to a place the subject may not
      have occupied on that date. amadeus does not need to model *why* the interval
      exists — that is the health layer''s business — only to honour it in the join.'
    title: Location
    from_schema: https://w3id.org/niehs/amadeus
    slots:
    - id
    - location_set
