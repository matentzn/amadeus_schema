        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - Asset
        - AmbientValue
        range: datetime
      retrieval_time_utc:
        name: retrieval_time_utc
        description: 'When amadeus obtained the value. Required by the AQS/AirNow
          rule: with revisable sources, "when we asked" is part of the value''s identity.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: datetime
      vertical_level:
        name: vertical_level
        description: Pressure or height level for multi-level products (NARR, MERRA-2,
          GEOS-CF). Part of the value's identity, not an attribute of it.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
