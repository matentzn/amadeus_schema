        description: The source's own version or revision identifier for this value,
          where it publishes one.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: string
      null_semantics:
        name: null_semantics
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: NullSemanticsEnum
        required: true
      superseded_by:
        name: superseded_by
        description: Identifier of the row that replaces this one. Revisions append;
          they do not mutate.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: string
    rules:
    - preconditions:
        slot_conditions:
          value:
            name: value
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          null_semantics:
            name: null_semantics
            any_of:
            - equals_string: structural_null
            - equals_string: derived_null
      description: A missing value must say why it is missing. Prevents the failure
        mode where nodata and a genuine zero are indistinguishable downstream.
    - preconditions:
        slot_conditions:
          null_semantics:
            name: null_semantics
            equals_string: true_zero
      postconditions:
        slot_conditions:
          value:
            name: value
            required: true
      description: A true zero is a present value, not an absence.
    - preconditions:
        slot_conditions:
          data_status:
            name: data_status
            equals_string: forecast
      postconditions:
        slot_conditions:
          reference_time:
            name: reference_time
            required: true
      description: A forecast is meaningless without its initialisation time. HRRR's
        "cycle and forecast-hour identity" requirement, enforced.
    - preconditions:
        slot_conditions:
          data_status:
            name: data_status
            equals_string: superseded
      postconditions:
        slot_conditions:
          superseded_by:
            name: superseded_by
            required: true
      description: A superseded row points at its replacement. Revisions create new
        records; they never mutate or delete old ones.
