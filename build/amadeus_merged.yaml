    - valid_from
    - valid_to
    - target_geography_type
    slot_usage:
      location_set:
        name: location_set
        required: true
      location_key:
        name: location_key
        description: The user's own identifier value, preserved verbatim.
        required: true
      location_geom_wkt:
        name: location_geom_wkt
        required: true
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: Location
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      location_set:
        name: location_set
        from_schema: https://w3id.org/niehs/amadeus
        owner: Location
        domain_of:
        - Location
        - ExtractionRequest
        range: LocationSet
        required: true
      location_key:
        name: location_key
        description: The user's own identifier value, preserved verbatim.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Location
        domain_of:
        - Location
        range: string
        required: true
      location_geom_wkt:
        name: location_geom_wkt
        from_schema: https://w3id.org/niehs/amadeus
        owner: Location
        domain_of:
        - Location
        range: WktLiteral
        required: true
      srid:
        name: srid
        description: Numeric spatial reference identifier, derived from `crs`. Materialised
          because `ST_SetSRID` takes an integer and the geometry views need it without
          a lookup.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Location
        domain_of:
        - Product
        - GridDefinition
        - Asset
        - StationObservation
        - GridCellValue
        - AreaValue
        - HexCellValue
        - VectorFeature
        - LocationSet
        - Location
        range: integer
      buffer_radius_m:
        name: buffer_radius_m
        description: Buffer radius in metres. Metres, explicitly — amadeus currently
          interprets `radius` in the units of the *projected* geometry's CRS, which
          for a geographic CRS means degrees, and the docs describe it as metres.
          Declaring the unit in the schema removes the ambiguity.
