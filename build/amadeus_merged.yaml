  LocationSet:
    name: LocationSet
    description: 'A user-supplied collection of locations — the `locs` argument, promoted
      to an entity. Carries the identifier field name (`locs_id`), the CRS the user
      supplied, and a PHI declaration.

      `phi_status` defaults to `no_phi` and is the gate on everything else: if a location
      set is flagged, results derived from it must not be written to shared catalog
      tables or embedded in an exported EnVar record, whose `phi_status` is a required
      field precisely so this cannot be left implicit.'
    title: Location Set
    from_schema: https://w3id.org/niehs/amadeus
    slots:
    - id
    - name
    - description
    - locs_id_field
    - crs
    - srid
    - geometry_type
    - location_count
    - phi_status
    - provided_by
    - created_at
    slot_usage:
      locs_id_field:
        name: locs_id_field
        description: Name of the user's identifier column. amadeus already takes this
          as `locs_id`; recording it means the output column names are derivable rather
          than conventional.
        examples:
        - value: site_id
        required: true
      phi_status:
        name: phi_status
        required: true
      crs:
        name: crs
        description: Declared, never assumed. `calculate_covariates()` currently reprojects
          `locs` to `crs(from)` silently; an undeclared input CRS is the most common
          way a spatial join goes quietly wrong.
        required: true
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: LocationSet
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      name:
        name: name
        description: A short machine-friendly name.
        from_schema: https://w3id.org/niehs/amadeus
        owner: LocationSet
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - LocationSet
        - ExtractionRequest
        range: string
      description:
        name: description
        from_schema: https://w3id.org/niehs/amadeus
        slot_uri: dcterms:description
        owner: LocationSet
        domain_of:
        - DataSource
        - Product
        - CanonicalVariable
        - LocationSet
        range: string
      locs_id_field:
        name: locs_id_field
        description: Name of the user's identifier column. amadeus already takes this
          as `locs_id`; recording it means the output column names are derivable rather
          than conventional.
        examples:
        - value: site_id
        from_schema: https://w3id.org/niehs/amadeus
        owner: LocationSet
        domain_of:
        - LocationSet
        range: string
        required: true
      crs:
        name: crs
        description: Declared, never assumed. `calculate_covariates()` currently reprojects
          `locs` to `crs(from)` silently; an undeclared input CRS is the most common
          way a spatial join goes quietly wrong.
        examples:
        - value: EPSG:4326
        - value: EPSG:5070
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:crs
        - hew:coordinate_reference_system_uri
        owner: LocationSet
        domain_of:
        - Product
        - GridDefinition
        - LocationSet
        range: string
        required: true
        pattern: ^[A-Za-z]+:[0-9]+$
      srid:
        name: srid
        description: Numeric spatial reference identifier, derived from `crs`. Materialised
          because `ST_SetSRID` takes an integer and the geometry views need it without
