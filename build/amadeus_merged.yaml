        domain_of:
        - AmadeusDatabase
        range: ProvenanceChain
        multivalued: true
        inlined: true
        inlined_as_list: true
    tree_root: true
  DataSource:
    name: DataSource
    description: 'A provider programme that publishes one or more products: EPA AQS,
      NASA MODIS, NOAA NARR, Climatology Lab. One row per row of the amadeus README
      source table.'
    title: Data Source
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - hew:HEWResource
    slots:
    - id
    - name
    - label
    - description
    - producer_institution
    - homepage
    - access_protocol
    - requires_authentication
    - auth_mechanism
    - rate_limit_requests_per_second
    - license_spdx
    - citation_apa
    - doi
    - amadeus_function_suffix
    slot_usage:
      name:
        name: name
        examples:
        - value: epa_aqs
        - value: noaa_ncep_narr
        required: true
      amadeus_function_suffix:
        name: amadeus_function_suffix
        examples:
        - value: _narr
        - value: _aqs
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: DataSource
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      name:
        name: name
        description: A short machine-friendly name.
        examples:
        - value: epa_aqs
        - value: noaa_ncep_narr
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - LocationSet
        - ExtractionRequest
        range: string
        required: true
      label:
        name: label
        description: A human-readable display label.
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        range: string
      description:
        name: description
        from_schema: https://w3id.org/niehs/amadeus
        slot_uri: dcterms:description
        owner: DataSource
        domain_of:
        - DataSource
        - Product
        - CanonicalVariable
        - LocationSet
        range: string
      producer_institution:
        name: producer_institution
        examples:
        - value: US Environmental Protection Agency
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_producer_institution
        owner: DataSource
        domain_of:
        - DataSource
        range: string
      homepage:
        name: homepage
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        range: uri
      access_protocol:
        name: access_protocol
        description: Primary access mechanism. Determines whether "subset early" is
          achievable at all for this source.
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        range: AccessProtocolEnum
      requires_authentication:
        name: requires_authentication
        description: Whether a credential is needed. True for all NASA Earthdata sources
          (`modis`, `merra2`, `geos`, SEDAC `population`).
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        range: boolean
      auth_mechanism:
        name: auth_mechanism
        examples:
        - value: NASA Earthdata bearer token
        - value: EPA AQS email + API key
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        range: string
      rate_limit_requests_per_second:
        name: rate_limit_requests_per_second
        description: Provider rate limit, as `download_data(rate_limit=)` already
          takes. In the catalog so a query planner can respect it without hard-coding.
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        range: float
      license_spdx:
        name: license_spdx
        examples:
        - value: CC0-1.0
        - value: NOASSERTION
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_license_spdx
        owner: DataSource
        domain_of:
        - DataSource
        - Product
        range: string
      citation_apa:
        name: citation_apa
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_citation_apa
        owner: DataSource
        domain_of:
        - DataSource
        - Product
        range: string
      doi:
        name: doi
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        - Product
        range: string
        pattern: ^10\.[0-9]{4,9}/.+$
      amadeus_function_suffix:
        name: amadeus_function_suffix
        description: The suffix amadeus uses for this source's functions (`_narr`
          → `download_narr`, `process_narr`, `calculate_narr`). Recorded so the catalog
          and the R API can be checked against each other mechanically — a catalog
          entry with no implementing function, or a function with no catalog entry,
          is a test failure.
        examples:
        - value: _narr
        - value: _aqs
        from_schema: https://w3id.org/niehs/amadeus
        owner: DataSource
        domain_of:
        - DataSource
        range: string
  Product:
    name: Product
    description: 'A specific, versioned data product from a source — the unit a user
      actually requests, and the unit that carries the *profile*: spatial support,
      temporal support, format, calendar, day boundary.

      This is where the answer to "do we need different schemas for different types
      of source data?" lives. We do not. The variation across the amadeus catalog
      decomposes into five orthogonal axes recorded here (`spatial_support_type`,
      `temporal_resolution`, `value` kind via the variables, `native_format`, and
      extensivity via the variables). One schema, one product table; a MODIS swath
      and an AQS monitor differ in their *values on these axes*, not in their structure.'
    title: Product
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - hew:DatasetResource
    - envar:SourceDataset
    slots:
    - id
    - name
    - label
    - description
    - data_source
    - product_version
    - data_genre
    - native_format
    - spatial_support_type
    - grid_definition
    - crs
    - srid
    - spatial_extent_bbox_wkt
    - spatial_extent_descriptor
    - native_spatial_resolution_m
    - native_spatial_resolution_descriptor
    - temporal_resolution
    - temporal_resolution_iso
    - temporal_alignment
    - day_boundary_convention
    - calendar
    - temporal_coverage_start
    - temporal_coverage_end
    - update_cadence_iso
    - typical_latency_iso
    - default_data_status
    - homogenisation_status
    - doi
    - license_spdx
    - citation_apa
    - access_url
    - amadeus_dataset_name
    - amadeus_process_covariate
    - amadeus_calculate_covariate
    - supports_server_side_subset
    - stac_collection_id
    slot_usage:
      name:
        name: name
        required: true
      data_source:
        name: data_source
        required: true
      spatial_support_type:
        name: spatial_support_type
        required: true
      temporal_resolution:
        name: temporal_resolution
        required: true
      grid_definition:
        name: grid_definition
        description: Required when `spatial_support_type` is a grid cell type, forbidden
          otherwise. Enforced by the rules below rather than by two separate classes
          — the project lead's "grid size is a dataset-level property" becomes a foreign
          key, not a copied field.
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: Product
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      name:
        name: name
        description: A short machine-friendly name.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - LocationSet
        - ExtractionRequest
        range: string
        required: true
      label:
        name: label
        description: A human-readable display label.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        range: string
      description:
        name: description
        from_schema: https://w3id.org/niehs/amadeus
        slot_uri: dcterms:description
        owner: Product
        domain_of:
        - DataSource
        - Product
        - CanonicalVariable
        - LocationSet
        range: string
      data_source:
        name: data_source
        description: The publishing programme.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: DataSource
        required: true
      product_version:
        name: product_version
        examples:
        - value: '061'
        - value: v1.5
        - value: '2021'
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_dataset_version
        owner: Product
        domain_of:
        - Product
        range: string
      data_genre:
        name: data_genre
        description: Thematic classification, from the README source table.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: DataGenreEnum
        multivalued: true
      native_format:
        name: native_format
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_native_format
        owner: Product
        domain_of:
        - Product
        - Asset
        range: NativeFormatEnum
      spatial_support_type:
        name: spatial_support_type
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - hew:support_type
        owner: Product
        domain_of:
        - Product
        range: SpatialSupportTypeEnum
        required: true
      grid_definition:
        name: grid_definition
        description: Required when `spatial_support_type` is a grid cell type, forbidden
          otherwise. Enforced by the rules below rather than by two separate classes
          — the project lead's "grid size is a dataset-level property" becomes a foreign
          key, not a copied field.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        - GridCellValue
        range: GridDefinition
      crs:
        name: crs
        description: Coordinate reference system as an authority code. Stored as the
          string form (`EPSG:4326`) because that is what both `terra` and the SQL
          engines accept; the numeric SRID is derived for `ST_SetSRID`.
        examples:
        - value: EPSG:4326
        - value: EPSG:5070
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:crs
        - hew:coordinate_reference_system_uri
        owner: Product
        domain_of:
        - Product
        - GridDefinition
        - LocationSet
        range: string
        pattern: ^[A-Za-z]+:[0-9]+$
      srid:
        name: srid
        description: Numeric spatial reference identifier, derived from `crs`. Materialised
          because `ST_SetSRID` takes an integer and the geometry views need it without
          a lookup.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        - GridDefinition
        - Asset
        - StationObservation
        - GridCellValue
        - AreaValue
        - HexCellValue
        - VectorFeature
        - LocationSet
        - Location
        range: integer
      spatial_extent_bbox_wkt:
        name: spatial_extent_bbox_wkt
        description: Coverage footprint as WKT, so extent is a spatial predicate.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: WktLiteral
      spatial_extent_descriptor:
        name: spatial_extent_descriptor
        examples:
        - value: Contiguous United States
        - value: Global
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:spatial_extent_descriptor
        owner: Product
        domain_of:
        - Product
        range: string
      native_spatial_resolution_m:
        name: native_spatial_resolution_m
        description: Nominal resolution in metres. Computable, and therefore the one
          a query planner uses — but meaningless for non-grid supports, hence the
          descriptor alongside it.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:native_spatial_resolution_m
        owner: Product
        domain_of:
        - Product
        range: float
      native_spatial_resolution_descriptor:
        name: native_spatial_resolution_descriptor
        examples:
        - value: 4 km
        - value: census tract
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:native_spatial_resolution_descriptor
        - hew:spatial_resolution
        owner: Product
        domain_of:
        - Product
        range: string
      temporal_resolution:
        name: temporal_resolution
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:temporal_resolution
        owner: Product
        domain_of:
        - Product
        range: TemporalResolutionEnum
        required: true
      temporal_resolution_iso:
        name: temporal_resolution_iso
        description: The same fact as `temporal_resolution`, as an ISO 8601 duration.
          Both are kept because the enum is validatable and the duration is expressive
          (`P3D` has no enum member). HEW uses the duration, EnVar the enum; this
          is the reconciliation, and it is generated, not hand-maintained.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - hew:temporal_resolution
        owner: Product
        domain_of:
        - Product
        range: Iso8601Duration
      temporal_alignment:
        name: temporal_alignment
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - hew:temporal_alignment
        owner: Product
        domain_of:
        - Product
        - ProductVariable
        range: TemporalAlignmentEnum
      day_boundary_convention:
        name: day_boundary_convention
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:day_boundary_convention
