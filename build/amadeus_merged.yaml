        description: The string a user passes as `variable=` to the amadeus download/process
          functions, where it differs from `native_name`.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - ProductVariable
        range: string
      value_data_type:
        name: value_data_type
        description: Optional override. Absent means "as the canonical variable declares".
          Present means this source genuinely differs — e.g. a source that publishes
          a binary exceedance flag for a quantity that is continuous elsewhere.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:value_data_type
        owner: ProductVariable
        domain_of:
        - CanonicalVariable
        - ProductVariable
        range: ValueDataTypeEnum
      extensivity:
        name: extensivity
        description: Optional override, same semantics as `value_data_type`. Overriding
          it is a strong signal something is wrong and should be reviewed.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - CanonicalVariable
        - ProductVariable
        range: VariableExtensivityEnum
      harmonization_note:
        name: harmonization_note
        description: 'Free text on why this delivery is not interchangeable with a
          sibling delivery of the same canonical variable. Deliberately unstructured:
          it is the intake queue for future first-class slots, not a permanent home.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - ProductVariable
        range: string
      metadata_gaps:
        name: metadata_gaps
        description: Which metadata this delivery is missing, and why. Makes the Tier
          1 backlog ("in the file, discarded by amadeus") countable and therefore
          reportable as progress.
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - ProductVariable
        range: MissingReasonEnum
        multivalued: true
    rules:
    - preconditions:
        slot_conditions:
          native_value_scale_factor:
            name: native_value_scale_factor
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          native_units_ucum:
            name: native_units_ucum
            required: true
      description: A scale factor without the unit it scales from is uninterpretable.
    - preconditions:
        slot_conditions:
          vertical_level_type:
            name: vertical_level_type
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          layer_name_template:
            name: layer_name_template
            pattern: .*\{level\}.*
      description: A multi-level variable's layer names must carry the level, or the
        level cannot be recovered when the raster is flattened.
