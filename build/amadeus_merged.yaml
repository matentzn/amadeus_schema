        required: true
      station_geom_wkt:
        name: station_geom_wkt
        required: true
      poc:
        name: poc
        description: Parameter Occurrence Code — which of several collocated monitors
          measuring the same parameter this is. Part of the AQS primary key and routinely
          dropped by naive ingests, which then silently pick one monitor per site.
      station_valid_from:
        name: station_valid_from
        description: Station moves are modelled as a validity interval on the observation's
          station identity rather than by mutating the station. "Station moves/POC
          changes" is a named edge case in the plan's test matrix.
