    name: StationObservation
    description: 'A value from a fixed instrument with a persistent identity: EPA
      AQS, AirNow, IMPROVE, USGS water sites.

      The distinguishing feature is not the point geometry — it is that the *instrument*
      is an entity with a history. Monitors move, get replaced, and report the same
      parameter through several collocated units (the AQS POC). A grid cell has none
      of that. Collapsing stations into a generic point table loses the keys that
      make a revision traceable.'
    title: Station Observation
    from_schema: https://w3id.org/niehs/amadeus
    is_a: AmbientValue
    slots:
