  AccessProtocolEnum:
    name: AccessProtocolEnum
    description: How amadeus reaches a source. Determines whether subsetting can be
      pushed to the provider, which is the whole point of the "subset early" principle.
    title: Access Protocol
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      https_bulk_file:
        text: https_bulk_file
        description: Fetch whole files over HTTPS. No server-side subsetting.
      ftp:
        text: ftp
      s3_object_store:
        text: s3_object_store
      stac_api:
        text: stac_api
        description: Spatio-temporal asset search. Supports geometry/time pushdown.
      opendap:
        text: opendap
        description: Supports variable and index-range pushdown.
      thredds:
        text: thredds
      rest_api:
        text: rest_api
        description: Provider-specific API with query parameters (AQS, AirNow, USGS).
      harmony:
        text: harmony
      arcgis_service:
        text: arcgis_service
  MaterializationModeEnum:
    name: MaterializationModeEnum
    annotations:
      source:
        tag: source
        value: amadeus-nextgen-meeting-plan.pdf §4.7.2
    description: How much of a source asset had to be brought local to answer a request.
      Taken verbatim from the modernization plan §4.7.2 so "streaming" is a recorded,
      auditable property of a run rather than an ungoverned side path.
    title: Materialization Mode
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      direct_remote_scan:
        text: direct_remote_scan
        description: Only the required columns, row groups, ranges or tiles were read.
      server_side_subset:
        text: server_side_subset
        description: The provider API returned exactly the requested subset.
      bounded_cache:
        text: bounded_cache
        description: Selected assets or chunks cached with checksums and a reuse policy.
      full_materialization:
        text: full_materialization
        description: The complete asset was downloaded because no reliable subset
          path exists. Cost and storage must be made visible before execution.
  RunRoleEnum:
    name: RunRoleEnum
    description: Which amadeus verb a tool run represents. The three public verbs
      plus the database-era additions.
    title: Run Role
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      download:
        text: download
      process:
        text: process
      calculate:
        text: calculate
      register:
        text: register
        description: An asset was catalogued without materialising its values.
      harmonize:
        text: harmonize
        description: Cross-source reconciliation, hexification, unit conversion.
      import:
        text: import
        description: An externally supplied dataset was brought into the catalog.
      export:
        text: export
        description: An EnVar record or analysis-ready table was emitted.
  PhiStatusEnum:
    name: PhiStatusEnum
    description: 'Whether a location set, and anything derived from it, is protected
      health information. An enum rather than a boolean for two reasons: it matches
      EnVar''s `phi_status` exactly, and — see `ValueMaterializationEnum` — a boolean
      cannot be used as a LinkML rule precondition.'
    title: PHI Status
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:PhiStatusEnum
    permissible_values:
      no_phi:
        text: no_phi
      aggregated_no_phi:
        text: aggregated_no_phi
      phi_present:
        text: phi_present
  ValueMaterializationEnum:
    name: ValueMaterializationEnum
    description: 'Whether an asset''s values exist as rows in a value table, or the
      asset is catalogued for discovery only.

      **This was a boolean and had to stop being one.** LinkML''s only equality construct
      in a rule precondition is `equals_string`, which generates `{"const": "true"}`
      — the JSON *string* `"true"` — and therefore never matches the JSON boolean
      `true`. A rule keyed on a boolean silently never fires. Verified 2026-09-18
      on linkml 1.9.x; see REPORT.md.'
    title: Value Materialization
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      registered_only:
        text: registered_only
        description: Catalogued and discoverable; no value rows written.
      materialized:
        text: materialized
        description: Value rows exist in a value table.
  StatusMixingPolicyEnum:
    name: StatusMixingPolicyEnum
    description: 'Whether a request may combine values of different `data_status`
      — in practice, AirNow preliminary alongside AQS quality-controlled. Defaults
      to refusing. An enum for the same reason as `ValueMaterializationEnum`: it is
      a rule precondition, and booleans cannot be.'
    title: Status Mixing Policy
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      refuse:
        text: refuse
        description: Reject the request if the candidate values differ in status.
          The default, per the harmonization rule in plan section 4.6.1.
      allow_with_policy:
        text: allow_with_policy
        description: Permitted, and `source_priority_policy` must state how values
          are reconciled.
  StrictnessEnum:
    name: StrictnessEnum
    title: Strictness
    from_schema: https://w3id.org/niehs/amadeus
    permissible_values:
      strict:
        text: strict
      permissive:
        text: permissive
  RunStatusEnum:
