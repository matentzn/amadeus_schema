    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:run_duration_seconds
    domain_of:
    - ToolRun
    range: float
  run_environment:
    name: run_environment
    description: 'Runtime environment as a JSON object string — R version, platform,
      key package versions (`terra`, `sf`, `exactextractr`), and the database engine
      and version. The engine matters: a SedonaDB result and a DuckDB result of the
      same request are not guaranteed identical, and the capability matrix the plan
      calls for is only auditable if each run says which engine ran it.'
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ToolRun
    range: string
  input_asset_ids:
    name: input_asset_ids
    description: Assets consumed by this run.
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ToolRun
    range: string
    multivalued: true
  input_file_sha256:
    name: input_file_sha256
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:input_file_sha256
    domain_of:
    - ToolRun
    range: Sha256
  input_row_count:
    name: input_row_count
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:input_row_count
    domain_of:
    - ToolRun
    range: integer
  output_file_sha256:
    name: output_file_sha256
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:output_file_sha256
    domain_of:
    - ToolRun
    range: Sha256
  output_row_count:
    name: output_row_count
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:output_row_count
    domain_of:
    - ToolRun
    range: integer
  upstream_runs:
    name: upstream_runs
    description: Identifiers of the runs this one consumed. The DAG edge. Typed as
      strings rather than object references so the table is self-contained and loadable
      before its own foreign keys resolve — a run may be recorded before its parents
      are fully written.
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ToolRun
    range: string
    multivalued: true
  status:
    name: status
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ToolRun
    range: RunStatusEnum
  log_excerpt:
    name: log_excerpt
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:run_log_excerpt
    domain_of:
    - ToolRun
    range: string
  bytes_transferred:
    name: bytes_transferred
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ToolRun
    range: integer
  request_count:
    name: request_count
    description: Number of HTTP or API requests issued, for rate-limit accounting.
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ToolRun
    range: integer
  chain_steps:
    name: chain_steps
    description: Run identifiers, ordered from the derived value back to the terminus.
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ProvenanceChain
    range: string
    multivalued: true
  terminus_type:
    name: terminus_type
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:provenance_chain_terminus_type
    domain_of:
    - ProvenanceChain
    range: ProvenanceChainTerminusEnum
  compatibility_assertions:
    name: compatibility_assertions
    description: Assertions that consecutive steps were compatible — matching CRS,
      units, calendar, day boundary. The seam between two steps belongs to neither
      step, and this is where a mismatch gets recorded instead of silently absorbed.
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - ProvenanceChain
    range: string
    multivalued: true
classes:
  AmadeusDatabase:
    name: AmadeusDatabase
    description: 'Container for a complete or partial AmadeusDB instance. Exists so
      a catalog snapshot, a sample dataset or an import bundle can be validated as
      one document with `linkml-validate`, and so the SQL generator has a root from
      which to reach every table.

      All collections are optional: a catalog-only bundle (the normal shape of a curation
      pull request) is as valid as a full instance.'
    title: Amadeus Database
    from_schema: https://w3id.org/niehs/amadeus
    slots:
    - schema_version
    - data_sources
    - products
    - grid_definitions
    - canonical_variables
    - product_variables
    - assets
    - station_observations
    - grid_cell_values
    - area_values
    - hex_cell_values
    - vector_features
    - location_sets
    - locations
    - extraction_requests
    - ambient_values_at_location
    - tool_runs
    - provenance_chains
    attributes:
      schema_version:
        name: schema_version
        description: Version of the AmadeusDB schema a record conforms to, so consumers
          can branch on schema evolution rather than guess.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:schema_version
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: string
        required: true
      data_sources:
        name: data_sources
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: DataSource
        multivalued: true
        inlined: true
        inlined_as_list: true
      products:
        name: products
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: Product
        multivalued: true
        inlined: true
        inlined_as_list: true
      grid_definitions:
        name: grid_definitions
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: GridDefinition
        multivalued: true
        inlined: true
        inlined_as_list: true
      canonical_variables:
        name: canonical_variables
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: CanonicalVariable
        multivalued: true
        inlined: true
        inlined_as_list: true
      product_variables:
        name: product_variables
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: ProductVariable
        multivalued: true
        inlined: true
        inlined_as_list: true
      assets:
        name: assets
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: Asset
        multivalued: true
        inlined: true
        inlined_as_list: true
      station_observations:
        name: station_observations
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: StationObservation
        multivalued: true
        inlined: true
        inlined_as_list: true
      grid_cell_values:
        name: grid_cell_values
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: GridCellValue
        multivalued: true
        inlined: true
        inlined_as_list: true
      area_values:
        name: area_values
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: AreaValue
        multivalued: true
        inlined: true
        inlined_as_list: true
      hex_cell_values:
        name: hex_cell_values
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: HexCellValue
        multivalued: true
        inlined: true
        inlined_as_list: true
      vector_features:
        name: vector_features
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: VectorFeature
        multivalued: true
        inlined: true
        inlined_as_list: true
      location_sets:
        name: location_sets
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: LocationSet
        multivalued: true
        inlined: true
        inlined_as_list: true
      locations:
        name: locations
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: Location
        multivalued: true
        inlined: true
        inlined_as_list: true
      extraction_requests:
        name: extraction_requests
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: ExtractionRequest
        multivalued: true
        inlined: true
        inlined_as_list: true
      ambient_values_at_location:
        name: ambient_values_at_location
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
        range: AmbientValueAtLocation
        multivalued: true
        inlined: true
        inlined_as_list: true
      tool_runs:
        name: tool_runs
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmadeusDatabase
        domain_of:
        - AmadeusDatabase
