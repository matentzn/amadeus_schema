      quality_flag_vocabulary:
        name: quality_flag_vocabulary
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:quality_flag_vocabulary
        owner: ProductVariable
        domain_of:
        - ProductVariable
        range: string
      layer_name_template:
        name: layer_name_template
        description: How amadeus composes `terra` layer names for this variable. Recorded
          because `calc_worker()` currently recovers variable, level and time by splitting
          the layer name on `_` and indexing by position; a declared template turns
          that from an implicit convention into a checkable one.
        examples:
        - value: '{native_name}_{YYYYMMDD}'
        - value: '{native_name}_{level}_{YYYYMMDD}'
        - value: '{native_name}_{YYYYMMDD}_{HHMMSS}'
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - ProductVariable
        range: string
      amadeus_variable_code:
