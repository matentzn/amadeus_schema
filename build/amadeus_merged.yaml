        range: string
      citation_apa:
        name: citation_apa
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_citation_apa
        owner: Product
        domain_of:
        - DataSource
        - Product
        range: string
      access_url:
        name: access_url
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_access_url
        owner: Product
        domain_of:
        - Product
        range: uri
      amadeus_dataset_name:
        name: amadeus_dataset_name
        description: The exact string accepted by `download_data(dataset_name=)`.
          The bridge between the catalog and the existing R API.
        examples:
        - value: narr
        - value: gridmet
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: string
      amadeus_process_covariate:
        name: amadeus_process_covariate
        description: The string accepted by `process_covariates(covariate=)`.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: string
      amadeus_calculate_covariate:
        name: amadeus_calculate_covariate
        description: The string accepted by `calculate_covariates(covariate=)`. Distinct
          from the process name — `modis_swath`/`modis_merge` both calculate as `modis`,
          and `aqs` processes but does not calculate.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: string
      supports_server_side_subset:
        name: supports_server_side_subset
        description: Whether the provider will return a geometry/time/variable subset.
          Drives the achievable `MaterializationModeEnum`.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: boolean
      stac_collection_id:
        name: stac_collection_id
        description: STAC collection identifier, where the product is STAC-published.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        - Asset
        range: string
    rules:
    - preconditions:
        slot_conditions:
          spatial_support_type:
            name: spatial_support_type
            any_of:
            - equals_string: raster_grid_cell
            - equals_string: model_grid_cell
      postconditions:
        slot_conditions:
          grid_definition:
            name: grid_definition
            required: true
      description: A gridded product must declare its grid. Without this, "1 km" lives
        in a description string and no query can reason about resolution.
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: daily
      postconditions:
        slot_conditions:
          day_boundary_convention:
            name: day_boundary_convention
            required: true
      description: A daily product must declare where its day starts. This rule alone
        would have caught the Daymet/GridMET 1.26 °C discrepancy at registration time.
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: timeless
      postconditions:
        slot_conditions:
          temporal_coverage_start:
            name: temporal_coverage_start
            value_presence: ABSENT
      description: A timeless product (GMTED elevation, Köppen-Geiger) asserts no
        temporal coverage start. Modelled as absence rather than a sentinel date.
    - preconditions:
        slot_conditions:
          temporal_resolution:
            name: temporal_resolution
            equals_string: timeless
      postconditions:
        slot_conditions:
          temporal_coverage_end:
            name: temporal_coverage_end
            value_presence: ABSENT
      description: A timeless product asserts no temporal coverage end.
  GridDefinition:
    name: GridDefinition
    description: A reusable description of a raster or model grid. Its own entity
      because several products share one grid (all NARR monolevel variables) and because
      resolution, projection and vertical levels must be computable, not prose.
    title: Grid Definition
    from_schema: https://w3id.org/niehs/amadeus
    slots:
    - id
    - name
    - label
    - crs
    - srid
    - grid_mapping_name
    - proj_string
    - resolution_x
    - resolution_y
    - resolution_unit
    - n_columns
    - n_rows
    - origin_x
    - origin_y
    - vertical_level_type
    - vertical_level_unit
    - vertical_levels
    slot_usage:
      crs:
        name: crs
        required: true
      resolution_x:
        name: resolution_x
        required: true
      resolution_y:
        name: resolution_y
        required: true
      vertical_levels:
        name: vertical_levels
        description: The pressure or height levels present, when the product is multi-level.
          NARR and MERRA-2/GEOS pressure-level products encode the level in the `terra`
          layer name (`variable_level_YYYYMMDD`); recording the level set here is
          what lets that be parsed reliably instead of positionally.
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: GridDefinition
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      name:
        name: name
        description: A short machine-friendly name.
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - LocationSet
        - ExtractionRequest
        range: string
      label:
        name: label
        description: A human-readable display label.
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        range: string
      crs:
        name: crs
        description: Coordinate reference system as an authority code. Stored as the
          string form (`EPSG:4326`) because that is what both `terra` and the SQL
          engines accept; the numeric SRID is derived for `ST_SetSRID`.
        examples:
        - value: EPSG:4326
        - value: EPSG:5070
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:crs
        - hew:coordinate_reference_system_uri
        owner: GridDefinition
        domain_of:
        - Product
        - GridDefinition
        - LocationSet
        range: string
        required: true
        pattern: ^[A-Za-z]+:[0-9]+$
      srid:
        name: srid
        description: Numeric spatial reference identifier, derived from `crs`. Materialised
          because `ST_SetSRID` takes an integer and the geometry views need it without
          a lookup.
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - Product
        - GridDefinition
        - Asset
        - StationObservation
        - GridCellValue
        - AreaValue
        - HexCellValue
        - VectorFeature
        - LocationSet
        - Location
        range: integer
      grid_mapping_name:
        name: grid_mapping_name
        description: CF grid mapping name.
        examples:
        - value: lambert_conformal_conic
        - value: latitude_longitude
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: string
      proj_string:
        name: proj_string
        description: Full PROJ or WKT2 CRS definition, for grids with no authority
          code.
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: string
      resolution_x:
        name: resolution_x
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: float
        required: true
      resolution_y:
        name: resolution_y
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: float
        required: true
      resolution_unit:
        name: resolution_unit
        examples:
        - value: m
        - value: deg
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: string
      n_columns:
        name: n_columns
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: integer
      n_rows:
        name: n_rows
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: integer
      origin_x:
        name: origin_x
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: float
      origin_y:
        name: origin_y
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: float
      vertical_level_type:
        name: vertical_level_type
        examples:
        - value: isobaric_pressure_hPa
        - value: height_above_ground_m
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        - ProductVariable
        range: string
      vertical_level_unit:
        name: vertical_level_unit
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        - AmbientValue
        range: string
      vertical_levels:
        name: vertical_levels
        description: The pressure or height levels present, when the product is multi-level.
          NARR and MERRA-2/GEOS pressure-level products encode the level in the `terra`
          layer name (`variable_level_YYYYMMDD`); recording the level set here is
          what lets that be parsed reliably instead of positionally.
        from_schema: https://w3id.org/niehs/amadeus
        owner: GridDefinition
        domain_of:
        - GridDefinition
        range: float
        multivalued: true
  CanonicalVariable:
    name: CanonicalVariable
    description: 'A harmonised environmental quantity, independent of who publishes
      it. The cross-source identity anchor: `gridmet.tmmx`, `prism.tmax` and `daymet.tmax`
      are three `ProductVariable`s over *one* `CanonicalVariable`, and that is what
      makes "is it the same variable?" answerable by a join rather than by a conversation.

      Carries the semantics that must be identical across sources (`standard_name`,
      canonical units, extensivity, plausible range, concept bindings). Everything
      that legitimately differs per source lives on `ProductVariable`.'
    title: Canonical Variable
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - hew:EnvironmentalVariable
    - envar:VariableIdentity
    slots:
    - id
    - name
    - label
    - description
    - standard_name
    - standard_name_authority
    - units_ucum
    - units_display
    - value_data_type
    - extensivity
    - default_aggregation_method
    - plausible_min
    - plausible_max
    - concept_mappings
    - omop_concept_binding
    - envar_variable_family
    slot_usage:
      name:
        name: name
        examples:
        - value: air_temperature_daily_maximum
        - value: pm25_mass_concentration
        required: true
      standard_name:
        name: standard_name
        required: true
      units_ucum:
        name: units_ucum
        required: true
      value_data_type:
        name: value_data_type
        required: true
      extensivity:
        name: extensivity
        required: true
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: CanonicalVariable
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      name:
        name: name
        description: A short machine-friendly name.
        examples:
        - value: air_temperature_daily_maximum
        - value: pm25_mass_concentration
        from_schema: https://w3id.org/niehs/amadeus
        owner: CanonicalVariable
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - LocationSet
        - ExtractionRequest
        range: string
        required: true
      label:
        name: label
        description: A human-readable display label.
        from_schema: https://w3id.org/niehs/amadeus
        owner: CanonicalVariable
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        range: string
      description:
        name: description
        from_schema: https://w3id.org/niehs/amadeus
        slot_uri: dcterms:description
        owner: CanonicalVariable
        domain_of:
        - DataSource
        - Product
        - CanonicalVariable
        - LocationSet
        range: string
      standard_name:
        name: standard_name
        description: The standard-name identifier for the physical quantity, as a
          CURIE so no single naming authority is privileged. Prefer a CF standard
          name where one exists; fall back to ECTO/ENVO or a minted `AMADEUS:` term.
          The prefix carries the authority; the slot name does not.
        examples:
        - value: CF:air_temperature
        - value: CF:mass_concentration_of_pm2p5_ambient_aerosol_particles_in_air
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:standard_name
        - hew:measured_property
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: uriorcurie
        required: true
      standard_name_authority:
        name: standard_name_authority
        examples:
        - value: CF Standard Name Table v85
        from_schema: https://w3id.org/niehs/amadeus
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: string
      units_ucum:
        name: units_ucum
        description: Canonical units in UCUM notation, bare (not CURIE-prefixed).
          HEW prefixes (`UCUM:Cel`), EnVar does not (`Cel`); we follow EnVar and note
          the difference, because it is exactly the kind of thing a mechanical mapper
          gets wrong silently.
        examples:
        - value: Cel
        - value: ug/m3
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:units_ucum
        - hew:unit
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: string
        required: true
      units_display:
        name: units_display
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:units_display
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: string
      value_data_type:
        name: value_data_type
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:value_data_type
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        - ProductVariable
        range: ValueDataTypeEnum
        required: true
      extensivity:
        name: extensivity
        description: Intensive, extensive or categorical. Determines which aggregation
          methods are legal for this variable — see `ExtractionRequest`.
        from_schema: https://w3id.org/niehs/amadeus
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        - ProductVariable
        range: VariableExtensivityEnum
        required: true
      default_aggregation_method:
        name: default_aggregation_method
        description: The aggregation applied when a request does not name one. Must
          be legal for the declared extensivity.
        from_schema: https://w3id.org/niehs/amadeus
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: AggregationMethodEnum
      plausible_min:
        name: plausible_min
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:value_range_plausible_min
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: float
      plausible_max:
        name: plausible_max
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:value_range_plausible_max
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: float
      concept_mappings:
        name: concept_mappings
        description: Mappings to any target vocabulary. One generic list rather than
          a slot per standard, so adding a vocabulary is a new prefix, not a schema
          change. EnVar and HEW arrived at this identical design independently.
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:concept_mappings
        - hew:concept_mappings
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: uriorcurie
        multivalued: true
      omop_concept_binding:
        name: omop_concept_binding
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - hew:omop_concept_binding
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: OmopConceptBinding
        inlined: true
      envar_variable_family:
        name: envar_variable_family
        description: Which EnVar variable family this belongs to, and therefore which
          variable-specific extension block an emitted EnVar record must carry (`derived_heat_metric`
          for the heat family).
        examples:
        - value: heat
        - value: air_quality
        from_schema: https://w3id.org/niehs/amadeus
        owner: CanonicalVariable
        domain_of:
        - CanonicalVariable
        range: string
    rules:
    - preconditions:
        slot_conditions:
          value_data_type:
            name: value_data_type
            equals_string: categorical
      postconditions:
        slot_conditions:
          extensivity:
            name: extensivity
            equals_string: categorical
      description: A categorical value must declare categorical extensivity.
    - preconditions:
        slot_conditions:
          extensivity:
            name: extensivity
            equals_string: categorical
      postconditions:
        slot_conditions:
          plausible_min:
            name: plausible_min
            value_presence: ABSENT
      description: A plausible numeric minimum is meaningless for a nominal class
        label.
    - preconditions:
        slot_conditions:
          extensivity:
            name: extensivity
            equals_string: categorical
      postconditions:
        slot_conditions:
          plausible_max:
            name: plausible_max
            value_presence: ABSENT
      description: A plausible numeric maximum is meaningless for a nominal class
        label.
  ProductVariable:
    name: ProductVariable
    description: 'One source''s delivery of one canonical variable: the native name,
      the native units and conversion, the CF metadata, the aggregation actually applied,
      and the layer-name template amadeus parses.

      Every slot here exists because it is a reason two sources of "the same" variable
      are not interchangeable. `native_units_ucum` + `native_value_scale_factor` +
      `native_value_offset` are the gridMET Kelvin→Celsius case, where the conversion
      happened at render time and was recorded nowhere.'
    title: Product Variable
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:VariableIdentity
    slots:
    - id
    - product
    - canonical_variable
    - native_name
    - label
    - native_units_ucum
    - native_value_scale_factor
    - native_value_offset
    - unit_conversion_formula
    - cf_standard_name
    - cf_cell_methods
    - aggregation_method
    - aggregation_window_iso
    - temporal_alignment
    - vertical_level_type
    - missing_value_sentinel
    - quality_flag_vocabulary
    - layer_name_template
    - amadeus_variable_code
    - value_data_type
    - extensivity
    - harmonization_note
    - metadata_gaps
    slot_usage:
      product:
        name: product
        required: true
      canonical_variable:
        name: canonical_variable
        required: true
      native_name:
        name: native_name
        examples:
        - value: weasd
        - value: tmmx
        - value: '88101'
        required: true
      layer_name_template:
        name: layer_name_template
        examples:
        - value: '{native_name}_{YYYYMMDD}'
        - value: '{native_name}_{level}_{YYYYMMDD}'
        - value: '{native_name}_{YYYYMMDD}_{HHMMSS}'
      value_data_type:
        name: value_data_type
        description: Optional override. Absent means "as the canonical variable declares".
          Present means this source genuinely differs — e.g. a source that publishes
          a binary exceedance flag for a quantity that is continuous elsewhere.
      extensivity:
        name: extensivity
        description: Optional override, same semantics as `value_data_type`. Overriding
          it is a strong signal something is wrong and should be reviewed.
    attributes:
      id:
        name: id
        description: Stable identifier for this entity within an AmadeusDB instance.
        from_schema: https://w3id.org/niehs/amadeus
        identifier: true
        owner: ProductVariable
        domain_of:
        - DataSource
        - Product
        - GridDefinition
        - CanonicalVariable
        - ProductVariable
        - Asset
        - AmbientValue
        - VectorFeature
        - LocationSet
        - Location
        - ExtractionRequest
        - ToolRun
        - ProvenanceChain
        range: uriorcurie
        required: true
      product:
        name: product
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - ProductVariable
        - Asset
        - VectorFeature
        range: Product
        required: true
      canonical_variable:
        name: canonical_variable
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - ProductVariable
        - AmbientValue
        range: CanonicalVariable
        required: true
      native_name:
        name: native_name
        description: 'The variable''s name in the source: a netCDF variable name,
          a MODIS subdataset, an AQS parameter code.'
        examples:
        - value: weasd
        - value: tmmx
        - value: '88101'
        from_schema: https://w3id.org/niehs/amadeus
        owner: ProductVariable
        domain_of:
        - ProductVariable
        range: string
        required: true
      label:
