    description: Version of the AmadeusDB schema a record conforms to, so consumers
      can branch on schema evolution rather than guess.
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:schema_version
    domain_of:
    - AmadeusDatabase
    range: string
    required: true
  crs:
    name: crs
    description: Coordinate reference system as an authority code. Stored as the string
      form (`EPSG:4326`) because that is what both `terra` and the SQL engines accept;
      the numeric SRID is derived for `ST_SetSRID`.
    examples:
    - value: EPSG:4326
    - value: EPSG:5070
    from_schema: https://w3id.org/niehs/amadeus
    exact_mappings:
    - envar:crs
    - hew:coordinate_reference_system_uri
    domain_of:
    - Product
    - GridDefinition
    - LocationSet
    range: string
    pattern: ^[A-Za-z]+:[0-9]+$
  srid:
    name: srid
    description: Numeric spatial reference identifier, derived from `crs`. Materialised
      because `ST_SetSRID` takes an integer and the geometry views need it without
      a lookup.
    from_schema: https://w3id.org/niehs/amadeus
    domain_of:
    - Product
