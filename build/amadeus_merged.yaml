        range: Iso8601Duration
      typical_latency_iso:
        name: typical_latency_iso
        description: 'Typical delay between observation and availability. The field
          that makes the AQS-versus-AirNow trade-off explicit: AQS is quality-controlled
          and months late, AirNow is preliminary and hourly.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: Iso8601Duration
      default_data_status:
        name: default_data_status
        description: The status values from this product carry unless a row says otherwise.
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - Product
        range: DataStatusEnum
      homogenisation_status:
        name: homogenisation_status
        from_schema: https://w3id.org/niehs/amadeus
        exact_mappings:
        - envar:source_homogenisation_status
        owner: Product
        domain_of:
        - Product
        range: HomogenisationStatusEnum
      doi:
        name: doi
        from_schema: https://w3id.org/niehs/amadeus
        owner: Product
        domain_of:
        - DataSource
        - Product
        range: string
