        from_schema: https://w3id.org/niehs/amadeus
        owner: LocationSet
        domain_of:
        - LocationSet
        range: integer
      phi_status:
        name: phi_status
        description: Whether these locations are or derive from protected health information.
          Gates persistence and export. Same slot name, range and value set as EnVar's
