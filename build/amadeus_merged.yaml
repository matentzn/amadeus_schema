      vertical_level_unit:
        name: vertical_level_unit
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - GridDefinition
        - AmbientValue
        range: string
      quality_flag:
        name: quality_flag
        description: The source's quality flag, verbatim, interpreted against the
          `quality_flag_vocabulary` on the product variable. Never normalised on ingest
          — normalising discards information, and the vocabularies do not align.
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: string
      data_status:
        name: data_status
        description: 'Per-row, not per-product. The AQS/AirNow rule requires it: a
          preliminary AirNow value and a quality-controlled AQS value for the same
          monitor, parameter and hour must be able to coexist as distinct rows.'
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
        - AmbientValue
        range: DataStatusEnum
        required: true
      source_system:
        name: source_system
        description: Which system supplied this row (`aqs`, `airnow`). Required on
          every row by the harmonization rule so preliminary and quality-controlled
          values for the same monitor-hour coexist rather than overwrite.
        examples:
        - value: aqs
        - value: airnow
        from_schema: https://w3id.org/niehs/amadeus
        owner: AmbientValue
        domain_of:
